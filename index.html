  /** 回傳 {far, mid, near}，每層為可水平平鋪的影像；有資產用資產，否則程式繪製水墨風 */
  /** v3.2：寒潭（冰藍）／魂門夜（赤紫）＝ 既有場景一次性像素重新上色（不用 ctx.filter，iOS Safari 也能顯示） */
  TINT: {
    frost: { src: 'ember', f: (r, g, b) => { const l = r * 0.3 + g * 0.55 + b * 0.15; return [l * 0.55 + 18, l * 0.82 + 38, l * 0.98 + 70]; } },
    gold:  { src: 'tower', layers: ['mid', 'near'], f: (r, g, b) => { const l = r * 0.3 + g * 0.55 + b * 0.15; return [Math.min(255, l * 0.95 + r * 0.15 + 30), l * 0.8 + 16, l * 0.5 + b * 0.12]; } },   // 雲頂金暉：保留塔樓遠景，岩層染成夕照金
    dusk:  { src: 'tower', f: (r, g, b) => { const l = r * 0.3 + g * 0.55 + b * 0.15; return [l * 0.78 + r * 0.12 + 22, l * 0.5 + 6, l * 0.72 + b * 0.1 + 34]; } },
  },
  tintCanvas(img, f) {
    const [w, h] = this.size(img); if (!w) return img; const c = this.canvas(w, h), x = c.getContext('2d'); x.drawImage(img, 0, 0);
    try { const d = x.getImageData(0, 0, w, h), a = d.data; for (let i = 0; i < a.length; i += 4) { if (!a[i + 3]) continue; const o = f(a[i], a[i + 1], a[i + 2]); a[i] = o[0]; a[i + 1] = o[1]; a[i + 2] = o[2]; } x.putImageData(d, 0, 0); } catch (e) { return img; }
    return c;
  },
  srcTheme(theme) { return (this.TINT[theme] && this.TINT[theme].src) || theme; },
  bg(theme) {
    const ck = 'bg:' + theme; if (this.fb[ck]) return this.fb[ck];
    const T = this.TINT[theme];
    if (T) { const S = this.bg(T.src); if (!this.fb['bg:' + T.src]) return S;
      const L = Object.assign({}, S); for (const layer of T.layers || ['far', 'mid', 'near']) if (S[layer]) L[layer] = this.tintCanvas(S[layer], T.f);
      return this.fb[ck] = L; }
    const L = {}; let loading = false;
    for (const layer of ['far', 'mid', 'near']) {
      const a = this.pick(`bg_${theme}_${layer}`, layer === 'far' ? `bg_${theme}` : null, theme === 'tower' ? `bg_rock_${layer}` : null);
      const im = a ? this.get(a) : null; if (a && !im) loading = true;
      L[layer] = im; L[layer + 'Asset'] = !!im; L[layer + 'Key'] = a;
    }
    const pt = theme === 'tower' ? 'rock' : theme;
    const pc = (n, f) => this.fb[n + ':' + pt] || (this.fb[n + ':' + pt] = f.call(this, pt));
    if (!L.far) L.far = pc('pf', this.paintFar);
    if (!L.mid) L.mid = pc('pm', this.paintMid);
    if (!L.near) L.near = pc('pn', this.paintNear);
    if (!loading) this.fb[ck] = L;

  },
  pal(theme) {
    return {
      bamboo: { sky: ['#e8f3e6', '#bfe0d2', '#8cc7b4'], mtn: ['#7fb3a2', '#5b9585', '#3d7768'], mid: '#2f6e55', mid2: '#4f9a6c', ground: ['#6f9b4f', '#4c7a39', '#3a5f2c'], dirt: '#8a6a43', accent: '#c9e8a0' },
      rock: { sky: ['#eef4f7', '#c8dde8', '#92b7c9'], mtn: ['#9cb7c6', '#7598ad', '#557b92'], mid: '#4c6a7c', mid2: '#6f8fa2', ground: ['#8c9a8f', '#6b7a70', '#505d55'], dirt: '#76685a', accent: '#e8f1f5' },
      ember: { sky: ['#3a2a35', '#4f3540', '#6b4038'], mtn: ['#5a3a3a', '#47302f', '#352423'], mid: '#2c1f1e', mid2: '#4a3128', ground: ['#6b4a35', '#54392a', '#3d2a20'], dirt: '#3a2a20', accent: '#ffcf7a' },
    }[theme];
  },
  seeded(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; },
  paintFar(theme) {
    const P = this.pal(theme), W = 1024, H = 512, cv = this.canvas(W, H), x = cv.getContext('2d'), r = this.seeded(7);
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, P.sky[0]); g.addColorStop(0.6, P.sky[1]); g.addColorStop(1, P.sky[2]); x.fillStyle = g; x.fillRect(0, 0, W, H);
    if (theme === 'ember') { // 洞頂鐘乳石 + 遠方金光
      const rg = x.createRadialGradient(W * 0.6, H * 0.55, 10, W * 0.6, H * 0.55, 300); rg.addColorStop(0, '#ffcf7a88'); rg.addColorStop(1, '#ffcf7a00'); x.fillStyle = rg; x.fillRect(0, 0, W, H);
    } else { x.fillStyle = '#fffbe8'; x.globalAlpha = 0.8; x.beginPath(); x.arc(W * 0.72, H * 0.2, 34, 0, 6.283); x.fill(); x.globalAlpha = 1; }
    // 三層水墨山（無縫：首尾高度相同）
    for (let l = 0; l < 3; l++) {
      const base = H * (0.5 + l * 0.13), amp = 90 - l * 22; x.fillStyle = P.mtn[l]; x.globalAlpha = 0.55 + l * 0.18;
      x.filter = `blur(${(2 - l) * 1.5}px)`;
      x.beginPath(); x.moveTo(0, H);
      const n = 8 + l * 3, ph = r() * 6.28;
      for (let i = 0; i <= 64; i++) { const t = i / 64, X = t * W; const Y = base - amp * (0.55 + 0.45 * Math.sin(t * Math.PI * 2 * 2 + ph)) * (0.6 + 0.4 * Math.abs(Math.sin(t * Math.PI * n))); x.lineTo(X, Y); }
      x.lineTo(W, H); x.closePath(); x.fill();
      // 霧帶
      x.filter = 'blur(10px)'; x.fillStyle = theme === 'ember' ? '#00000033' : '#ffffff55'; x.fillRect(0, base - 6, W, 26);
    }

    return cv;
  },
  paintMid(theme) {
    const P = this.pal(theme), W = 1024, H = 512, cv = this.canvas(W, H), x = cv.getContext('2d'), r = this.seeded(31);
    x.lineCap = 'round';
    if (theme === 'bamboo') {
      for (let i = 0; i < 26; i++) { const X = (i / 26) * W + r() * 20, w = 7 + r() * 7, top = r() * 120; x.strokeStyle = i % 3 ? P.mid : P.mid2; x.globalAlpha = 0.75 + r() * 0.25; x.lineWidth = w; x.beginPath(); x.moveTo(X, H); x.lineTo(X + 6, top); x.stroke();
        for (let j = top + 40; j < H; j += 46 + r() * 20) { x.strokeStyle = '#1e4a3a'; x.lineWidth = 2; x.beginPath(); x.moveTo(X - w / 2 + 1, j); x.lineTo(X + w / 2 + 1, j); x.stroke(); }
        x.fillStyle = P.mid2; for (let j = 0; j < 4; j++) { const ly = top + 20 + r() * 200; x.beginPath(); x.ellipse(X + 18, ly, 22, 5, -0.5 + r(), 0, 6.283); x.fill(); } }
    } else if (theme === 'rock') {
      for (let i = 0; i < 7; i++) { const X = i / 7 * W + r() * 40, w = 90 + r() * 70, top = 120 + r() * 160; const g = x.createLinearGradient(X, 0, X + w, 0); g.addColorStop(0, P.mid2); g.addColorStop(1, P.mid); x.fillStyle = g; x.globalAlpha = 0.9;
        x.beginPath(); x.moveTo(X, H); x.lineTo(X + w * 0.1, top + 30); x.lineTo(X + w * 0.4, top); x.lineTo(X + w * 0.75, top + 20); x.lineTo(X + w, H); x.fill();
        x.fillStyle = '#2f5a3a'; x.beginPath(); x.ellipse(X + w * 0.45, top + 4, w * 0.3, 12, 0, 0, 6.283); x.fill(); }
      // 棧道
      x.globalAlpha = 1; x.strokeStyle = '#6b4a2a'; x.lineWidth = 5; x.beginPath(); x.moveTo(0, 330); x.lineTo(W, 330); x.stroke();
      for (let X = 0; X < W; X += 32) { x.lineWidth = 3; x.beginPath(); x.moveTo(X, 330); x.lineTo(X, 360); x.stroke(); }
    } else {
      for (let i = 0; i < 18; i++) { const X = i / 18 * W + r() * 30, w = 30 + r() * 40, len = 60 + r() * 160; x.fillStyle = i % 2 ? P.mid : P.mid2; x.globalAlpha = 0.95; x.beginPath(); x.moveTo(X, 0); x.lineTo(X + w / 2, len); x.lineTo(X + w, 0); x.fill(); }
      for (let i = 0; i < 9; i++) { const X = i / 9 * W + r() * 60, w = 70 + r() * 60, hh = 120 + r() * 140; x.fillStyle = P.mid; x.beginPath(); x.moveTo(X, H); x.lineTo(X + w / 2, H - hh); x.lineTo(X + w, H); x.fill();
        const cg = x.createRadialGradient(X + w / 2, H - hh * 0.6, 2, X + w / 2, H - hh * 0.6, 40); cg.addColorStop(0, '#ffd27acc'); cg.addColorStop(1, '#ffd27a00'); x.fillStyle = cg; x.fillRect(X - 40, H - hh - 40, w + 80, hh); }
    }
    x.globalAlpha = 1; return cv;
  },
  paintNear(theme) {
    const P = this.pal(theme), W = 1024, H = 256, cv = this.canvas(W, H), x = cv.getContext('2d'), r = this.seeded(97);
    // 地面：上緣草/石帶 + 下方土層（錨點：y=48 為地平線）
    const g = x.createLinearGradient(0, 40, 0, H); g.addColorStop(0, P.ground[0]); g.addColorStop(0.25, P.ground[1]); g.addColorStop(1, P.ground[2]);

  /** 平鋪繪製一層（offset 為世界捲動量 × 視差） */

};

/* =====================================================================
 * TrialManager（魂器試煉：次數 / 結算 / 掃蕩）+ TrialBattle（即時割草戰鬥）
 * 依據 wuxia-docs/魂器試煉_功能規格_v0.1.md
 * ===================================================================== */
const TrialManager = {
  maxAttempts() { return CFG.trial.baseDaily + VipManager.sum('trial') + VipManager.cardSum('trial') + S.trial.ticketAtt + GuildManager.eff('soulExtra'); },
  remaining() { return Math.max(0, this.maxAttempts() - S.trial.used); },
  isTutorial() { return !S.trial.tutorial; },
  canStart(L) { return L >= 1 && L <= Math.min(CFG.trial.maxLayer, S.trial.maxCleared + 1) && (this.remaining() > 0 || this.isTutorial()); },
  ticketPrice() { const p = CFG.trial.ticketPrices; return p[Math.min(S.trial.ticketBought, p.length - 1)]; },
  ticketBuyCap() { return CFG.trial.ticketBuyBase + Math.floor(VipManager.level() / 2); },
  buyTicket() { if (S.trial.ticketBought >= this.ticketBuyCap() || S.res.ticket >= 99) return false; if (!Eco.pay({ copper: this.ticketPrice() })) return false; S.trial.ticketBought++; S.res.ticket++; return true; },
  useTicket() { if (S.res.ticket <= 0 || S.trial.ticketAtt >= 10) return false; S.res.ticket--; S.trial.ticketAtt++; return true; },
  band(L) { return CFG.trial.bands.find(b => L <= b.max) || CFG.trial.bands[CFG.trial.bands.length - 1]; },
  ratingOf(score) { return CFG.trial.rating.find(r => score >= r.min); },
  rollRewards(L, rt, first, firstS) {
    const b = this.band(L);
    const r = { copper: Math.round((b.copper[0] + b.copper[1] * L) * rt.mult), essence: Math.round(b.essence * rt.mult * (1 + GuildManager.eff('soulPct') / 100)), stone: Math.round(b.stone * rt.mult), exp: Math.round(CFG.trial.expReward(L) * rt.mult) };
    if (first) Object.entries(b.first).forEach(([k, v]) => r[k] = (r[k] || 0) + v);
    if (firstS) r.bun = (r.bun || 0) + 20;
    Eco.add(r);
    const n = Math.max(1, b.items + rt.items);
    let dist = b.q.concat([0]);
    if (rt.r === 'S') dist = EquipManager.shift(dist, 5);
    dist = EquipManager.shift(dist, VipManager.qShift() + (S.realm.lv - 1));   // 境界 / VIP 小幅上移
    const items = [];
    for (let i = 0; i < n; i++) { const it = EquipManager.drop(EquipManager.rollQuality(dist), CFG.trial.itemLevel(L)); if (it) items.push(it); }
    return { r, items };
  },
  settle(L, score, detail) {
    const rt = this.ratingOf(score);
    const rec = S.trial.rec[L] || (S.trial.rec[L] = { best: '', score: 0 });
    const first = !rec.best, firstS = rt.r === 'S' && rec.best !== 'S';
    const order = 'CBAS';
    if (!rec.best || order.indexOf(rt.r) > order.indexOf(rec.best)) rec.best = rt.r;
    rec.score = Math.max(rec.score, score);
    const tut = this.isTutorial();
    if (tut) S.trial.tutorial = true; else S.trial.used++;     // 成功才扣次【規格 §10.1】；首次引導不扣
    S.trial.maxCleared = Math.max(S.trial.maxCleared, L);
    S.trial.runs++;
    const got = this.rollRewards(L, rt, first, firstS);
    return Object.assign({ rating: rt, first, firstS, tut, score, detail }, got);
  },
  canSweep(L) { return S.trial.rec[L] && S.trial.rec[L].best === 'S' && this.remaining() > 0; },
  sweep(L) { if (!this.canSweep(L)) return null; S.trial.used++; S.stats.sweep++; return this.rollRewards(L, CFG.trial.rating[0], false, false); },
};


/* =====================================================================
 * TrialBattle（橫向卷軸版）— 對應 Unity：BattleManager + CameraController + VFXPool
 * 世界座標：x 沿關卡前進，y = 離地高度（0 = 地面），z = 前後景深微調
 * 依據 wuxia-docs/魂器試煉_功能規格_v0.1.md 的流程：選層 → 隨機地圖 → 限時清怪集能量 → 傳送門 → 守衛 → 結算
 * ===================================================================== */
const VW = 480;   // 畫面可視寬度（世界單位）

/* ---------- 共用：橫向場景繪製（試煉 / 俠客居待機 / 爬塔 共用） ---------- */
const SV = {
  /** v3.1：地面資料來自 tools/ground.py 量測（src/ground.js → GROUND.themes）

/* ---------- 粒子 / VFX 池 ---------- */
class FXPool {
  constructor() { this.a = []; }
  add(o) { o.life = o.life || 0.5; o.max = o.life; this.a.push(o); if (this.a.length > 500) this.a.shift(); return o; }
  update(dt) {
    const dn = [];   // v3.4：done 回呼延後到過濾完才執行（回呼裡新增的特效才不會被吃掉）
    this.a = this.a.filter(f => {
      f.life -= dt; if (f.life <= 0) { if (f.done) dn.push(f.done); return false; }
      if (f.g) f.vy -= f.g * dt;
      if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; if (f.drag) { f.vx *= 1 - f.drag * dt; f.vy *= 1 - f.drag * dt; } }
      return true;
    });
    dn.forEach(fn => fn());
  }
  /** 依座標轉換函式繪製（world→screen） */
  draw(c, X, Y, s, t) {
    for (const f of this.a) {
      const k = f.life / f.max, sx = f.screen ? f.x : X(f.x), sy = f.screen ? f.y : Y(f.y, f.z || 0);
      c.save();
      switch (f.k) {
        case 'spark': c.globalAlpha = k; c.strokeStyle = f.c; c.lineWidth = (f.w || 3) * s; c.lineCap = 'round'; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx - f.vx * 0.04 * s, sy + f.vy * 0.04 * s); c.stroke(); break;
        case 'dot': c.globalAlpha = k; c.fillStyle = f.c; c.beginPath(); c.arc(sx, sy, (f.r || 3) * s * (0.5 + k * 0.5), 0, 6.283); c.fill(); break;
        case 'glow': { c.globalCompositeOperation = 'lighter'; const r = (f.r || 20) * s * (f.grow ? 1 + (1 - k) * f.grow : 1); const g = c.createRadialGradient(sx, sy, 0, sx, sy, r); g.addColorStop(0, f.c); g.addColorStop(1, 'rgba(0,0,0,0)'); c.globalAlpha = k; c.fillStyle = g; c.fillRect(sx - r, sy - r, r * 2, r * 2); break; }
        case 'ring': c.globalAlpha = k; c.strokeStyle = f.c; c.lineWidth = (f.w || 5) * s * k + 1; c.beginPath(); c.ellipse(sx, sy, f.R * s * (1 - k * k * 0.8), f.R * s * (f.flat || 0.35) * (1 - k * k * 0.8), 0, 0, 6.283); c.stroke(); break;
        case 'slash': { // 弧形刀光
          c.globalCompositeOperation = 'lighter'; c.translate(sx, sy); c.scale(f.dir || 1, 1); c.rotate(f.rot || 0);
          const p = 1 - k, a0 = -1.6 + p * 0.4, a1 = a0 + 0.4 + p * 2.6, R = f.R * s;
          c.globalAlpha = Math.min(1, k * 2);
          const g = c.createLinearGradient(-R, 0, R, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, f.c || '#e9fffb');
          c.fillStyle = g; c.beginPath(); c.arc(0, 0, R, a0, a1); c.arc(R * 0.08, 0, R * 0.78, a1, a0, true); c.closePath(); c.fill();
          c.strokeStyle = '#ffffff'; c.lineWidth = 2 * s; c.beginPath(); c.arc(0, 0, R, a0 + (a1 - a0) * 0.4, a1); c.stroke(); break; }
        case 'text': { const p = 1 - k; const sc = f.big ? (p < 0.12 ? 0.6 + p / 0.12 * 0.7 : 1.3 - Math.min(0.3, (p - 0.12) * 1.5)) : (p < 0.1 ? 0.7 + p * 3 : 1);
          c.globalAlpha = Math.min(1, k * 2.5); c.translate(sx, sy); c.scale(sc, sc); c.textAlign = 'center';
          BTX.draw(c, f.s, 0, 0, f.size * s * 1.08, [f.c === '#fff' || f.c === '#ffffff' ? '#ffffff' : '#fffbe8', f.c || '#ffe066', f.c || '#f29a1c'], { ol: f.stroke || '#14302b', rim: 'rgba(0,0,0,.35)', lw: 0.22, sh: 0.4 }); break; }
        case 'orb': { // 魂能飛向 HUD（螢幕座標貝茲曲線）
          const p = 1 - k, e = p * p * (3 - 2 * p); const x = (1 - e) * (1 - e) * f.x0 + 2 * (1 - e) * e * f.cx + e * e * f.x1, y = (1 - e) * (1 - e) * f.y0 + 2 * (1 - e) * e * f.cy + e * e * f.y1;

        case 'coin': { c.translate(sx, sy); const sq = Math.abs(Math.cos(t * 10 + f.ph)); c.scale(sq * 0.8 + 0.2, 1); const r = 6 * s; const g = c.createLinearGradient(0, -r, 0, r); g.addColorStop(0, '#fff3b0'); g.addColorStop(1, '#d99a1a'); c.fillStyle = g; c.strokeStyle = '#7a4d0a'; c.lineWidth = 1.5 * s; c.beginPath(); c.arc(0, 0, r, 0, 6.283); c.fill(); c.stroke(); break; }

/* ------------------------- 試煉戰鬥 ------------------------- */
const TB = {
  cv: null, ctx: null, W: 0, H: 0, dpr: 1, running: false, raf: 0, keys: {}, joy: null,
  open(L) {
    this.L = L;
    const el = document.getElementById('battle'); el.classList.add('on');
    this.cv = document.getElementById('bcv'); this.ctx = this.cv.getContext('2d');
    this.resize(); window.addEventListener('resize', this.onResize = () => this.resize());
    this.bindInput();
    this.setup();
    this.running = true; this.paused = false; this.last = performance.now();
    cancelAnimationFrame(this.raf); this.raf = requestAnimationFrame(t => this.loop(t));
    this.hud();
  },
  close() {
    this.running = false; cancelAnimationFrame(this.raf);
    window.removeEventListener('resize', this.onResize);
    document.getElementById('battle').classList.remove('on');
    document.getElementById('bresult').innerHTML = '';
    UI.render();
  },
  resize() {
    if (!this.cv) return;
    const r = this.cv.getBoundingClientRect(); this.dpr = Math.min(2, window.devicePixelRatio || 1);
    this.W = r.width || 390; this.H = r.height || 460; this.cv.width = this.W * this.dpr; this.cv.height = this.H * this.dpr;
    this.s = this.W / VW; this.GY = this.H * 0.82;
  },
  /* 操作：點擊＝跳躍；右滑＝衝刺；左滑＝閃避；鍵盤 Space/W/↑ 跳、D/→ 衝刺、A/← 閃避、E/Enter 進傳送門、P/Esc 暫停 */
  bindInput() {
    if (this.bound) return; this.bound = true;
    this.keys = {}; this.joy = null;
    window.addEventListener('keydown', e => {
      if (!this.running || this.over) return; const k = e.key.toLowerCase(); if (this.keys[k]) return; this.keys[k] = true;
      if (k === ' ' || k === 'w' || k === 'arrowup') { this.act('jump'); e.preventDefault(); }
      else if (k === 'd' || k === 'arrowright') this.act('dash');
      else if (k === 'a' || k === 'arrowleft') this.act('dodge');
      else if (k === 'e' || k === 'enter') this.act('portal');
      else if (k === 'p' || k === 'escape') this.togglePause();
    });
    window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
    const cv = document.getElementById('bcv');
    cv.addEventListener('pointerdown', e => { this.joy = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId }; });
    const end = e => {
      const j = this.joy; if (!j || e.pointerId !== j.id) return; this.joy = null;
      const dx = e.clientX - j.x, dy = e.clientY - j.y;
      if (Math.abs(dx) > 34 && Math.abs(dx) > Math.abs(dy)) this.act(dx > 0 ? 'dash' : 'dodge');
      else if (dy < -34) this.act('jump');
      else if (Math.hypot(dx, dy) < 20) this.act('jump');
    };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', () => this.joy = null);
    [['bjump', 'jump'], ['bdash', 'dash'], ['bdodge', 'dodge']].forEach(([id, a]) => { const b = document.getElementById(id); if (b) b.addEventListener('pointerdown', e => { e.preventDefault(); if (this.running && !this.over) { this.act(a); b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit'); } }); });
  },
  act(a, ai) {
    const p = this.p; if (!p || this.over || this.paused) return false;
    if (!ai) this.manualT = 1.2;   // 玩家剛操作過 → 自動閃避讓位 1.2 秒
    if (a === 'jump') { if (p.y > 0.5) return false; p.vy = 560; p.jumps++; this.fx.add({ k: 'ring', x: p.x, y: 0, R: 30, c: '#ffffffaa', life: 0.3, flat: 0.25 }); return true; }
    if (a === 'dash') { if (p.dashCd > 0) return false; p.dashCd = 1.1; p.dashT = 0.18; p.dashDir = 1; p.inv = Math.max(p.inv, 0.3); p.dashHit = new Set(); this.trail(p); return true; }
    if (a === 'dodge') { if (p.dodgeCd > 0) return false; p.dodgeCd = 0.9; p.dashT = 0.2; p.dashDir = -1; p.inv = Math.max(p.inv, 0.42); this.trail(p); return true; }
    if (a === 'portal') { if (this.phase === 'clear' && this.energy >= 100) { this.goPortal = true; return true; } }
    return false;
  },
  trail(p) { for (let i = 0; i < 4; i++) this.fx.add({ k: 'glow', x: p.x - p.dashDir * i * 18, y: p.y + 50, c: 'rgba(160,255,240,.55)', r: 34, life: 0.25 + i * 0.05 }); },
  setup() {
    const L = this.L, C = CFG.trial;
    const gen = C.gen.find(g => L <= g.maxL);
    const ti = Math.random() < 0.5 ? gen.theme : rint(0, C.themes.length - 1);
    this.theme = C.themes[ti]; this.themeKey = this.theme.key || ART.themeKey(ti);
    const st = PlayerManager.stats();

      const tint = isBoss && (e.enr || e.tele) ? (e.enr || e.tele.kind === 'enrage' ? '#ff2a3a' : e.tele.kind === 'shield' || e.tele.kind === 'icefall' ? '#9fdcff' : '#ffb340') : null;
      const tintA = !tint ? 0 : e.enr ? 0.28 + Math.sin(this.T * 10) * 0.1 : 0.15 + Math.abs(Math.sin(this.T * 14)) * 0.3;
      ART.draw(c, e.k, x + tq, y, h, { flip: ally ? !ART.faceLeftFlip(e.k) : flip, sx: o.sx, sy: o.sy, rot: o.rot * (ally ? 1 : -1), alpha, flash: e.flash, tint, tintA, ent: e, role: ally ? 'ally' : isBoss ? 'boss' : 'mob', T: this.T, s });
      if (isBoss && !e.endT) this.drawBossFx(c, e, x, y, h, s);
      if (e.elite && e.hp > 0) { c.save(); c.font = `900 ${11 * s}px sans-serif`; c.textAlign = 'center'; c.lineWidth = 3; c.strokeStyle = '#3a1a00'; c.fillStyle = '#ffd34d'; c.strokeText('精英 · ' + e.name, x, y - h - 12 * s); c.fillText('精英 · ' + e.name, x, y - h - 12 * s); c.restore(); }
      if (ally) e.flash = Math.max(0, (e.flash || 0) - 0.08);
      if (!ally && !isBoss && e.hp < e.max) SV.hpBar(c, X(e.x), y - h - 8, 34 * s, e.hp / e.max, '#ff6b5b');
    }
    if (this.resting) {   // 休息：暮色＋營火光暈
      c.fillStyle = 'rgba(6,24,40,.38)'; c.fillRect(0, 0, W, H);
      const fx0 = X(this.team[0].x + 46), gl = c.createRadialGradient(fx0, GY - 10, 0, fx0, GY - 10, 120 * s); gl.addColorStop(0, `rgba(255,190,90,${0.45 + Math.sin(this.T * 9) * 0.06})`); gl.addColorStop(1, 'rgba(255,190,90,0)');
      c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = gl; c.fillRect(fx0 - 130 * s, GY - 140 * s, 260 * s, 170 * s); c.restore();
    }
    this.drawShots(c, X, Y, s, GY);
    SV.drawAssist(c, this, X, Y, s, this.T, GY);
    this.fx.draw(c, X, (y, z) => Y(y, z), s, this.T);
    SV.drawCutins(c, this, W, H, s);
    if (this.flashA > 0) { c.fillStyle = `rgba(255,255,255,${this.flashA * 0.6})`; c.fillRect(0, 0, W, H); }
    // 底部漸層，讓舞台與下方面板自然銜接
    const g = c.createLinearGradient(0, H - 26, 0, H); g.addColorStop(0, 'rgba(243,226,184,0)'); g.addColorStop(1, 'rgba(243,226,184,.85)'); c.fillStyle = g; c.fillRect(0, H - 26, W, 26);
  },
};

/* ---------------- 啟動 ---------------- */
function boot() {
  if (!ART._ok) { ART.init(); ART._ok = 1; }
  { const R = document.documentElement;
    ['panel_title', 'card_frame', 'btn_primary', 'btn_secondary', 'btn_disabled', 'btn_round', 'title_banner'].forEach(k => { const a = ART.pick('ui_' + k); if (a) { R.style.setProperty('--' + k.replace('_', '-'), `url(${ASSETS[a]})`); R.classList.add('has-' + k); } }); }
  const existed = SaveManager.load();
  dailyReset();
  RealmManager.tick();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (el.disabled) return;
    const a = el.dataset.act; const fn = UI.act[a]; if (!fn) return;
    if (el.tagName === 'INPUT') { fn(el.dataset, el); SaveManager.save(); return; }
    fn(el.dataset, el);
    SaveManager.save();
    if (!['mclose', 'item', 'hero', 'starup', 'bt', 'team', 'allres', 'settings', 'cyes', 'cno', 'resetsave', 'towerfight', 'bosschallenge', 'bossinfo', 'tb_pause', 'tb_speed', 'tb_auto', 'tb_quit', 'tb_portal', 'recruit', 'setleader', 'buycard', 'buybig', 'buylife', 'recharge', 'salvageworse'].includes(a) || !document.getElementById('modal').classList.contains('on')) {
      if (!['tb_pause', 'tb_speed', 'tb_auto', 'tb_quit', 'tb_portal', 'towerfight', 'bosschallenge', 'bossinfo'].includes(a)) UI.render();
    }
  });
  document.querySelectorAll('[data-ico]').forEach(i => i.innerHTML = ICO.get(i.dataset.ico));
  document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => UI.navTo(b.dataset.nav)));
  UI.render(); HS.init();
  // 離線歸來
  const away = (now() - S.lastSeen) / 1000;
  if (existed && away > 120) {
    const p = IdleManager.preview(); const mines = {}; CFG.mines.forEach(m => { const a = Math.floor(IdleManager.mineAmount(m.id)); if (a) mines[m.res] = (mines[m.res] || 0) + a; });
    UI.modal(`<h3>🍵 閉關歸來</h3><p style="text-align:center">你離開了 <b class="goldt">${fmtTime(away)}</b>，俠客們替你闖蕩江湖${away / 3600 > IdleManager.capH() ? `（掛機上限 ${IdleManager.capH()} 小時）` : ''}：</p>
      <div class="rewards">${UI.rewardChips({ copper: p.copper, exp: p.exp, iron: p.iron, page: p.page })}<span class="rw">🎁裝備×${p.equips}</span></div>
      ${Object.keys(mines).length ? `<div class="sub" style="text-align:center">礦脈產出：${UI.rewardChips(mines, true)}</div>` : ''}
      <div class="sub" style="text-align:center">離線收益加成 +${VipManager.offlinePct()}%</div>
      <div style="text-align:center;margin-top:10px"><button class="btn big pulse" data-act="welcomeclaim">全部領取</button></div>`);
  } else if (!existed) {
    UI.modal(`<h3>歡迎來到江湖</h3><p>少俠，你在竹林中醒來，身邊只有樵童阿竹與一箱舊裝備。</p><div class="hint">跟著舞台下方的「目標」走，每完成一步都有獎勵。<br>上方舞台的俠客會自動斬妖；斬滿進度就能挑戰試煉之塔首領。<br>掛機寶箱會一直累積收益，離線也算！</div><div style="text-align:center"><button class="btn big" data-act="mclose">踏入江湖</button></div>`);
  }
  UI.act.welcomeclaim = () => { const { r, items } = IdleManager.claim(); const m = IdleManager.mineCollectAll(); for (const k in m) r[k] = (r[k] || 0) + m[k]; UI.rewardPopup('閉關收穫', r, items); };
  let saveT = 0;
  setInterval(() => {
    if (dailyReset()) { UI.toast('新的一天！每日次數已重置'); UI.render(); }
    if (RealmManager.tick()) UI.render();
    UI.live(); UI.renderGoal(); if (!TB.running) { UI.renderHeader(); UI.dots(); if (UI.view === 'home' && HS.state !== 'boss') UI.renderStageHud(); }
    if (++saveT % 5 === 0) SaveManager.save();
  }, 1000);
  window.addEventListener('beforeunload', () => SaveManager.save());
  document.addEventListener('visibilitychange', () => { if (document.hidden) SaveManager.save(); });
}

      if (i >= n) { const d = defs[i] || {}; return `<div class="fslot lock"><div class="fl">🔒</div><small>${d.txt || '尚未開放'}</small></div>`; }
      const id = S.team[i];
      if (!id) return `<div class="fslot empty ${sel === i ? 'sel' : ''}" data-act="fslot" data-i="${i}"><div class="fl">＋</div><small>空位</small></div>`;

    };
    const own = CFG.heroes.filter(h => HeroManager.owned(h.id)).sort((a, b) => HeroManager.power(b.id) - HeroManager.power(a.id));
    const selId = sel >= 0 ? S.team[sel] : null;

      : selId ? `已選「${heroDef(selId).name}」：點下方俠客＝替換，點另一個位置＝互換。` : '已選空位：點下方俠客放入此位置。';
    const acts = selId ? `<div class="row fact"><button class="btn sm gray" data-act="fremove" data-i="${sel}">下陣</button>${selId !== L ? `<button class="btn sm" data-act="fleader" data-id="${selId}">設為隊長</button>` : '<span class="tag">隊長（舞台主角）</span>'}<button class="btn sm gray" data-act="fsel" data-i="-1">取消選取</button></div>` : '';

      if (inT >= 0) { UI.fsel = inT; return UI.formation(); }

  });

        c.globalCompositeOperation = 'lighter'; const g = c.createRadialGradient(0, 0, 0, 0, 0, rr * 4); g.addColorStop(0, p.col); g.addColorStop(1, 'rgba(0,0,0,0)'); c.globalAlpha = fl * (p.k === 'dust' ? 0.35 : 0.8); c.fillStyle = g; c.fillRect(-rr * 4, -rr * 4, rr * 8, rr * 8); c.globalAlpha = fl; c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, rr * 0.45, 0, 6.283); c.fill(); }

/* =====================================================================
 * v3.4 動畫層（ANIM）
 * 1) 逐幀角色：主角／四套時裝／鸞／焚 → fr_<角色>_<姿勢>（idle, w1~w4, hit, wind, strike, recov, charge, cast, ko）
 *    走路幀依「實際移動距離」切換 → 腳步與位移同步，不滑步
 * 2) 其他精靈（俠客、所有妖物／精英／首領）→ rig-lite 條帶網格變形（前傾、扭腰、落地擠壓、呼吸、受擊後仰、首領蓄力後仰）
 * 3) 打擊感：預備動作 → 出招殘影 → 收招、頓幀（hit-stop 40~80ms）、擊退、閃白、暴擊／首領震屏、傷害數字彈跳、水墨爆散死亡
 * 4) 招式特效：劍氣、火焰、鸞的飛劍、焚的火輪（皆為生成圖 fx_*，加亮混合）
 * ===================================================================== */
const ANIM = {
  R: { zhu: 1.0167, cos_liuyun: 1.0067, cos_xuanye: 1.0067, cos_zhuying: 1.0067, cos_jinli: 1.0067, luan: 1.09, fen: 1.5333 },
  hs: 0, frozen: 0,
  /** 動畫時鐘：頓幀期間凍結 */
  now() { return performance.now() / 1000 - this.frozen; },
  /** 頓幀（秒）：40~80ms */
  stop(sec) { this.hs = Math.max(this.hs, sec); },
  chOf(k) { if (!k) return null; const m = k.split('|')[0].match(/^side_(.+)$/); return m && this.R[m[1]] && ART.has('fr_' + m[1] + '_idle') ? m[1] : null; },
  busy(e) { return e._sk && this.now() - e._sk.t0 < e._sk.dur; },
  /** 開始一次普攻動畫，回傳「到出招幀」的秒數 */
  attack(e) { e._at = { t0: this.now(), dur: 0.42 }; return 0.12; },
  ease: u => u * u * (3 - 2 * u),

  /* ---------- 姿勢選擇 ---------- */
  framePose(e, role) {
    const now = this.now();
    if (e._ko) return 'ko';
    if (role === 'assist' && e.dur) {
      const k = e.t / e.dur;
      if (k < 0.32) return k < 0.12 ? 'charge' : 'w2';
      if (k < 0.62) { const u = (k - 0.32) / 0.3; return u < 0.12 ? 'wind' : u < 0.55 ? 'strike' : 'recov'; }
      return 'w3';
    }
    if (e._sk) { const u = (now - e._sk.t0) / e._sk.dur; if (u < 1) return u < 0.5 ? 'charge' : 'cast'; }
    if (e._at) { const u = (now - e._at.t0) / e._at.dur; if (u < 1) return u < 0.29 ? 'wind' : u < 0.62 ? 'strike' : 'recov'; }
    // 試煉戰：沒有走 ANIM.attack 的出招 → 依 atkT 推算
    if (e.atkT > 0) { const u = 1 - e.atkT / (e.atkMax || 0.22); return u < 0.25 ? 'wind' : u < 0.7 ? 'strike' : 'recov'; }
    if (e.flash > 0.55) return 'hit';
    if (e.y > 2) return 'w2';
    if (this.moving(e)) { const d = e._dist || 0; return 'w' + (1 + Math.floor(d / 11) % 4); }
    return 'idle';
  },
  /** 依世界座標累積移動距離（走路幀與位移同步） */
  track(e) {
    const x = e.x || 0, t = this.now();
    if (e._px === undefined) { e._px = x; e._pt = t; }
    const d = Math.abs(x - e._px); e._dist = (e._dist || 0) + d;
    if (d > 0.05) e._mvT = t; e._px = x; return d;
  },
  moving(e) { return e.moving || (e._mvT && this.now() - e._mvT < 0.12); },

  /* ---------- rig-lite 變形參數（以「面向方向」為正） ---------- */
  warpOf(e, role, T) {
    const now = this.now(), ph = e.ph || 0, w = { lean: 0, sway: 0, ph: 0, sq: 0, bulge: 0, top: 0 };
    const heavy = role === 'boss' || e.elite || e.type === 'tank', hop = e.type === 'fast', fly = e.fly > 0 || e.k === 'c';
    let dy = 0;
    if (role === 'boss' && e.tele) {   // 首領蓄力：後仰＋下蹲，越接近出招越明顯
      const u = this.ease(Math.min(1, e.tele.t / (e.tele.dur || 1)));
      w.lean = -0.13 * u; w.sq = 0.09 * u; w.bulge = 0.04 * u; w.top = -0.05 * u;
    } else if (e.atkT > 0) {           // 出招：前撲＋拉長
      const k = 1 - e.atkT / (e.atkMax || 0.25), l = Math.sin(Math.min(1, k) * Math.PI);
      w.lean = (k < 0.2 ? -0.06 : 0.17) * l; w.sq = -0.06 * l; w.top = 0.05 * l;
    } else if (e._at && now - e._at.t0 < e._at.dur) {   // 無逐幀的隊長：蓄力後仰 → 前撲
      const u = (now - e._at.t0) / e._at.dur;
      if (u < 0.29) { const a = u / 0.29; w.lean = -0.08 * a; w.sq = 0.05 * a; }
      else { const a = Math.sin(Math.min(1, (u - 0.29) / 0.71) * Math.PI); w.lean = 0.16 * a; w.sq = -0.05 * a; w.top = 0.04 * a; }
    } else if (this.moving(e) && !fly) {
      const d = (e._dist || 0) + ph * 10, st = heavy ? 26 : 16, p = d / st * Math.PI, b = Math.abs(Math.sin(p));
      if (hop) { dy = b * 9; w.sq = b > 0.15 ? -0.05 * b : 0.13 * (1 - b / 0.15); w.lean = 0.07; }
      else { dy = b * (heavy ? 2 : 3); w.sq = (heavy ? 0.07 : 0.05) * (1 - b) - 0.02 * b; w.lean = 0.06 + 0.02 * b; w.sway = 0.03 * Math.sin(p); w.ph = p; }
    } else if (fly) {
      w.sway = 0.025; w.ph = T * 6 + ph; w.bulge = 0.05 * Math.sin(T * 14 + ph); w.sq = 0.03 * Math.sin(T * 7 + ph);
    } else {                            // 呼吸
      const b = Math.sin(T * 2.6 + ph); w.sq = -0.025 * b; w.bulge = 0.015 * b; w.sway = 0.01; w.ph = T * 1.3 + ph;
    }
    if (e.kb > 0) { w.lean -= Math.min(0.16, e.kb * 0.011); w.top -= Math.min(0.06, e.kb * 0.004); }
    else if (e.flash > 0.3) w.lean -= 0.07 * e.flash;

  /* ---------- 繪製包裝 ---------- */
  draw(c, k, x, y, h, o) {
    const e = o.ent, role = o.role, s = o.s || 1, T = o.T || this.now();
    if (!e || o.noAnim) return this.base(c, k, x, y, h, o);
    this.track(e);

    if (ch) {   // 逐幀
      const pose = this.framePose(e, role), fk = ART.pick('fr_' + ch + '_' + pose, 'fr_' + ch + '_idle');
      const fh = h * this.R[ch], flip = !screenR, dir = screenR ? 1 : -1;
      const br = pose === 'idle' ? Math.sin(T * 2.6 + (e.ph || 0)) : 0;
      const oo = { flip, alpha: o.alpha, flash: (o.flash || 0) * 0.5, tint: o.tint, tintA: o.tintA, sx: 1 - br * 0.008, sy: 1 + br * 0.018 };

  /* ---------- 招式特效（圖片粒子） ---------- */
  drawFx(c, f, X, Y, s) {
    const k = f.life / f.max, p = 1 - k;
    if (f.k === 'img') {
      const img = ART.get(f.key); if (!img) return; const [iw, ih] = ART.size(img);
      const hh = f.sz * s * (1 + (f.grow || 0) * p), ww = hh * iw / ih;
      const a = (f.a ?? 1) * Math.min(1, k * (f.fadeOut || 3)) * Math.min(1, p * (f.fadeIn || 99) + (f.fadeIn ? 0 : 1));
      c.save(); c.translate(X(f.x), Y(f.y)); c.rotate((f.rot || 0) + (f.spin || 0) * p * f.max); c.scale(f.flip ? -1 : 1, f.sy || 1);
      c.globalAlpha = Math.max(0, Math.min(1, a)); if (f.add) c.globalCompositeOperation = 'lighter';

/* =====================================================================
 * v3.5 戰鬥流暢度（俠客居掛機舞台）
 * - 妖群一波 3~5 隻、成群出現；隊長衝刺接敵 → 突進殘影 → 範圍弧形刀光，1~3 秒清一波，清完立刻奔向下一波
 * - 受擊純白閃 60ms、重擊擊退、死亡擊飛淡出；大號彈跳傷害數字（K/M/B），暴擊黃字粗黑邊
 * - x1/x2/x3 倍速、四個圓形技能鈕（冷卻掃描、可自動、可手動提早放）、三招大招全螢幕特效
 * - 自動畫質：連續掉幀時減少殘影、粒子與解析度
 * 全部只是表現層：掛機收益仍依時間計算；首領勝負仍由戰力判定
 * ===================================================================== */
CFG.c35 = {   // 【建議調整】v3.5 節奏數值
  waveMin: 3, waveMax: 5,      // 每波妖物數：成群出現才有「一刀清一片」的爽感
  atkCd: 0.34,                 // 普攻間隔 0.5 → 0.34 秒：配合範圍刀光，一波約 1~3 秒清完
  cleave: 95,                  // 範圍刀光：目標前後 95 單位內的妖物一起吃傷害
  sprint: 250,                 // 兩波之間衝刺速度（原 92）：不讓玩家等待
  dashFrom: 200,               // 距離 < 200 時突進貼身（殘影）
  need: 24,                    // 首領進度 8 → 24 隻：擊殺速度約快 3 倍，挑戰首領的時間間隔維持原本約 20 秒
  killsPerBun: 12,             // 每斬 4 → 12 隻消耗 1 包子：擊殺速度變快，維持「滿包子可推進約 40 分鐘」
  x3: { vip: 1, chap: 1 },     // x3 倍速：VIP1 或推進到第二章（章節 idx ≥ 1）解鎖
  skills: [
    { id: 'qi', name: '劍氣斬', ic: 'sk_qi', cd: 4.5, desc: '前方一道巨大劍氣，貫穿整排妖物' },
    { id: 'whirl', name: '旋風斬', ic: 'sk_whirl', cd: 8, desc: '捲起青色旋風向前推進，連續切割' },
    { id: 'blast', name: '爆炎訣', ic: 'sk_blast', cd: 11, desc: '在妖群中心引爆烈焰' },
    { id: 'sword', name: '天劍訣', ic: 'sk_sword', cd: 16, ult: true, desc: '奧義：天降巨劍，全場重創' },
  ],
};
CFG.stamina.killsPerBun = CFG.c35.killsPerBun;

/** K/M/B 縮寫（傷害數字專用） */
function fmtK(v) {
  v = Math.max(0, Math.round(v || 0));
  const t = (n, u) => (n >= 100 ? Math.round(n) : n >= 10 ? Math.round(n * 10) / 10 : Math.round(n * 100) / 100) + u;
  if (v < 1000) return String(v);
  if (v < 1e6) return t(v / 1e3, 'K'); if (v < 1e9) return t(v / 1e6, 'M'); return t(v / 1e9, 'B');
}

const C35 = {
  cds: [0, 0, 0, 0], castGap: 0, combo: 0, comboT: 0, waveN: 0, low: 0, ema: 1 / 60, badT: 0, goodT: 0,
  spdOk3() { const X = CFG.c35.x3; return VipManager.level() >= X.vip || ChapterManager.cur().idx >= X.chap; },
  spd() { const v = (S.opt && S.opt.spd35) || 1; return v === 3 && !this.spdOk3() ? 2 : v; },
  auto() { return !S.opt || S.opt.autoSk35 !== false; },
  alive(st) {
    if (st.state === 'boss') return [...(st.adds || []), st.boss].filter(m => m && m.hp > 0 && !m.endT);
    return st.mobs.filter(m => m.hp > 0 && !m.dead);
  },
  onScreen(st) { return this.alive(st).filter(m => m.x - st.camX < VW + 10 && m.x > st.camX - 20); },

  /* ---------- 傷害結算（技能與範圍刀光共用） ---------- */
  hit(st, m, units, crit, bossMul) {
    if (!m || !(m.hp > 0) || m.endT) return;
    m.wf = 0.07; m.flash = 1; m.kb = Math.max(m.kb || 0, crit ? 30 : 16);
    if (m === st.boss) { st.bossHit(true, bossMul || 1); return; }
    m.hp -= units; st.num(m.x, 16 + rnd(0, 26), Math.round(PlayerManager.power() * 0.05 * units * rnd(0.9, 1.15)), crit);
  },

  /* ---------- 一波妖群 ---------- */
  spawnWave(st) {
    const n = rint(CFG.c35.waveMin, CFG.c35.waveMax), lead = st.team[0];
    const x0 = Math.max(st.camX + VW + 30, lead.x + 320);
    st._wave35 = { n, x0 }; st.spawn(); st._wave35 = null; this.waveN++;
  },

  /* ---------- 技能 ---------- */
  ready(i) { return this.cds[i] <= 0; },
  cast(st, i, manual) {
    const D = CFG.c35.skills[i], lead = st.team[0];
    if (!lead || !this.ready(i) || st.resting || (st.boss && st.boss.endT) || UI.view !== 'home') return false;
    const tg = this.onScreen(st).sort((a, b) => a.x - b.x);
    if (!tg.length) { if (manual) UI.toast('附近沒有妖物'); return false; }
    this.cds[i] = D.cd; this.castGap = 0.55; lead._sk = { t0: ANIM.now(), dur: D.ult ? 0.7 : 0.5 }; lead._at = null; lead.cd = Math.max(lead.cd, 0.3);
    AudioManager.play(D.ult ? 'elite' : 'skill');
    const col = (heroDef(lead.id) && heroDef(lead.id).color) || '#9ff5e8';
    st.fx.add({ k: 'img', key: 'fx_ring', x: lead.x, y: lead.h * 0.45, sz: lead.h * 1.2, grow: -0.45, life: 0.3, add: true, a: 0.8, fadeIn: 4 });
    this.callout(st, D, lead);
    this['sk_' + D.id](st, lead, tg, col);
    this.renderBtns(true);
    return true;
  },
  callout(st, D, lead) {
    st.fx.add({ k: 'call', s: D.name, ult: !!D.ult, x: lead.x + 50, y: lead.h + 8, life: D.ult ? 1.1 : 0.8 });
  },
  sk_qi(st, lead, tg) {   // 劍氣斬：一道巨大的弧形劍氣橫掃前方
    const x0 = lead.x + 30;
    st.fx.add({ k: 'nop', life: 0.12, done: () => {
      st.fx.add({ k: 'img', key: 'fx_arc' + rint(0, 3), x: x0, y: 52, vx: 760, vy: 0, sz: 190, life: 0.36, add: true, fadeOut: 4, sy: 1.15 });
      st.fx.add({ k: 'img', key: 'fx_arc' + rint(0, 3), x: x0 - 30, y: 52, vx: 700, vy: 0, sz: 150, life: 0.34, add: true, a: 0.45, fadeOut: 4 });
      const hitAt = m => st.fx.add({ k: 'nop', life: Math.max(0.02, (m.x - x0) / 760), done: () => { this.hit(st, m, 2.2, true, 1.1); this.arcAt(st, m.x - 6, true); } });
      this.onScreen(st).filter(m => m.x - lead.x < 300).forEach(hitAt);
      st.shake = Math.max(st.shake, 6); ANIM.stop(0.06);
    } });
  },
  sk_whirl(st, lead) {    // 旋風斬：旋風向前推進，每 0.18 秒切一次
    const w = st.fx.add({ k: 'img', key: 'fx_whirl', x: lead.x + 60, y: 96, vx: 230, vy: 0, sz: 230, life: 1.1, add: true, a: 0.95, fadeIn: 8, fadeOut: 5 });
    for (let i = 0; i < 6; i++) st.fx.add({ k: 'nop', life: 0.12 + i * 0.16, done: () => {
      st.shake = Math.max(st.shake, 4);
      this.alive(st).filter(m => Math.abs(m.x - w.x) < 80).forEach(m => { this.hit(st, m, 0.75, i === 5, 0.5); m.kb = 22; });
      for (let k = 0; k < 4; k++) { const a = Math.random() * 6.28; st.fx.add({ k: 'spark', x: w.x, y: rnd(30, 150), vx: Math.cos(a) * 300, vy: Math.sin(a) * 200, life: 0.25, w: 3, c: k % 2 ? '#bffff0' : '#5fe6c4' }); }
    } });
  },
  sk_blast(st, lead, tg) {   // 爆炎訣：妖群中心爆炸
    const cx = tg.slice(0, 5).reduce((a, m) => a + m.x, 0) / Math.min(5, tg.length);
    st.fx.add({ k: 'img', key: 'fx_flame', x: lead.x + 40, y: 60, vx: (cx - lead.x - 40) / 0.22, vy: 0, sz: 70, life: 0.22, add: true, fadeOut: 8 });
    st.fx.add({ k: 'nop', life: 0.22, done: () => {
      st.fx.add({ k: 'img', key: 'fx_blast', x: cx, y: 80, sz: 120, grow: 1.9, life: 0.6, add: true, fadeOut: 2.2, rot: Math.random() * 6 });
      st.fx.add({ k: 'img', key: 'fx_blast', x: cx, y: 70, sz: 90, grow: 2.6, life: 0.45, add: true, a: 0.6, fadeOut: 2, rot: Math.random() * 6 });
      st.fx.add({ k: 'ring', x: cx, y: 0, R: 170, life: 0.5, c: '#ffb36b', w: 10 });
      for (let i = 0; i < (this.low ? 8 : 18); i++) { const a = Math.random() * 6.28; st.fx.add({ k: 'dot', x: cx, y: 70, vx: Math.cos(a) * rnd(200, 460), vy: Math.sin(a) * rnd(200, 460) + 120, g: 700, life: rnd(0.4, 0.8), r: rnd(3, 6), c: i % 3 ? '#ffcf5a' : '#ff6a2a' }); }
      ANIM.stop(0.11); st.shake = Math.max(st.shake, 13); st._warm = 0.45;
      this.alive(st).filter(m => Math.abs(m.x - cx) < 170).forEach(m => this.hit(st, m, 3, true, 1.5));
    } });
  },
  sk_sword(st, lead, tg) {   // 天劍訣（奧義）：場景變暗 → 巨劍從天而降 → 頓幀＋重震＋全場重創
    const cx = Math.min(tg.slice(0, 5).reduce((a, m) => a + m.x, 0) / Math.min(5, tg.length), st.camX + VW * 0.78);
    st._dim = 1.15;
    st.fx.add({ k: 'img', key: 'fx_ring', x: cx, y: 4, sz: 220, sy: 0.3, grow: -0.3, life: 0.45, add: true, a: 0.9, fadeIn: 3 });
    st.fx.add({ k: 'img', key: 'fx_gsword', x: cx, y: 560, vx: 0, vy: -1650, sz: 360, life: 0.3, add: true, fadeIn: 6, fadeOut: 99 });
    st.fx.add({ k: 'nop', life: 0.3, done: () => {
      st.fx.add({ k: 'img', key: 'fx_gsword', x: cx, y: 150, sz: 360, life: 0.75, add: true, fadeOut: 2.5 });
      st.fx.add({ k: 'img', key: 'fx_ring', x: cx, y: 6, sz: 120, sy: 0.35, grow: 3.2, life: 0.55, add: true });
      st.fx.add({ k: 'ring', x: cx, y: 0, R: 230, life: 0.6, c: '#fff1b0', w: 12 });
      st.fx.add({ k: 'shock', x: cx - 30, y: 0, dir: -1, vx: -420, vy: 0, life: 0.45 }); st.fx.add({ k: 'shock', x: cx + 30, y: 0, dir: 1, vx: 420, vy: 0, life: 0.45 });
      for (let i = 0; i < (this.low ? 10 : 26); i++) { const a = rnd(0.2, 2.94); st.fx.add({ k: 'dot', x: cx + rnd(-30, 30), y: 6, vx: Math.cos(a) * rnd(160, 520), vy: Math.sin(a) * rnd(260, 620), g: 1100, life: rnd(0.5, 0.9), r: rnd(2.5, 5.5), c: i % 3 ? '#e9dcc0' : '#ffe27a' }); }
      ANIM.stop(0.16); st.shake = Math.max(st.shake, 18); st.flashA = 0.75;
      this.alive(st).forEach(m => this.hit(st, m, 5, true, 2.2));
    } });
  },

  /* ---------- 弧形刀光 ---------- */
  arcAt(st, x, crit, y = 46) {
    const r = rnd(-0.45, 0.35), key = 'fx_arc' + rint(0, 3), sz = crit ? 158 : 122;
    st.fx.add({ k: 'img', key, x: x - 8, y, sz, grow: 0.22, life: 0.2, add: true, rot: r, fadeOut: 3.2, sy: Math.random() < 0.5 ? 1 : -1 });
    if (!this.low) st.fx.add({ k: 'img', key, x: x - 26, y: y + 4, sz: sz * 1.1, grow: 0.3, life: 0.32, add: true, a: 0.38, rot: r - 0.22, fadeOut: 2 });   // 拖尾
  },

  /* ---------- 每個子步驟 ---------- */
  post(st, dt) {
    const lead = st.team[0]; if (!lead) return;
    if (lead.cd > (lead._cd35 ?? 0) + 0.05 && lead.cd <= 0.5 && lead.cd > 0.45) lead.cd = CFG.c35.atkCd;   // 新一次普攻 → 縮短間隔
    lead._cd35 = lead.cd;
    st._dim = Math.max(0, (st._dim || 0) - dt); st._warm = Math.max(0, (st._warm || 0) - dt);
    [...st.mobs, ...(st.adds || []), st.boss].forEach(m => { if (m && m.wf > 0) m.wf -= dt; });
    // 連斬
    this.comboT -= dt; if (this.comboT <= 0) this.combo = 0;
    if (st.kills > (st._k35 ?? st.kills)) { this.combo += st.kills - st._k35; this.comboT = 2.6; }
    st._k35 = st.kills;
    // 冷卻＋自動施放
    this.cds = this.cds.map(c => Math.max(0, c - dt)); this.castGap -= dt;
    const busy = st.resting || (st.boss && st.boss.endT) || (st.jumps && st.jumps.length);
    if (this.auto() && !busy && this.castGap <= 0) {
      const near = this.alive(st).filter(m => m.x - lead.x < 210 && m.x > lead.x - 20);
      if (near.length) { const order = near.length >= 3 || st.state === 'boss' ? [3, 2, 1, 0] : [0, 1, 2, 3]; for (const i of order) if (this.ready(i) && this.cast(st, i)) break; }
    }
    // 移動：兩波之間衝刺、接近時突進
    lead._spr = 0;
    if (st.state === 'walk' && !st.resting) {
      const ahead = this.alive(st).filter(m => m.x > lead.x - 20).sort((a, b) => a.x - b.x)[0], dist = ahead ? ahead.x - lead.x : 1e9;
      if (lead._dash) { lead._dash.t -= dt; lead.x += lead._dash.v * dt; lead.moving = true; if (lead._dash.t <= 0 || dist < 62) lead._dash = null; }
      else if (ahead && dist > 100 && dist < CFG.c35.dashFrom && ahead.x - st.camX < VW) {
        lead._dash = { t: 0.13, v: (dist - 64) / 0.13 }; AudioManager.play('dash');
        for (let i = 0; i < 6; i++) st.fx.add({ k: 'dot', x: lead.x - 6, y: 4, vx: rnd(-220, -80), vy: rnd(30, 140), g: 600, life: rnd(0.25, 0.45), r: rnd(2, 4), c: '#e9dcc0' });
      } else if (dist > 100) {
        lead._spr = 1; lead.x += (CFG.c35.sprint - 92) * dt; lead.moving = true;
        lead._dustT = (lead._dustT || 0) - dt;
        if (lead._dustT <= 0 && !this.low) { lead._dustT = 0.09; st.fx.add({ k: 'dot', x: lead.x - 10, y: 3, vx: rnd(-140, -60), vy: rnd(20, 90), g: 400, life: 0.35, r: rnd(2, 3.5), c: 'rgba(233,220,192,.9)' }); }
      }
      // 新一波：場上沒有活著的妖物就立刻生成
      if (!StaminaManager.empty() && !this.alive(st).length && !st.mobs.length) this.spawnWave(st);
    }
  },

  /* ---------- 自動畫質 ---------- */
  perf(rdt) {
    if (!(rdt > 0) || rdt > 0.25) return;
    this.ema += (rdt - this.ema) * 0.08; const fps = 1 / this.ema;
    if (fps < 45) { this.badT += rdt; this.goodT = 0; } else if (fps > 56) { this.goodT += rdt; this.badT = 0; }
    if (!this.low && this.badT > 2) { this.low = 1; this.badT = 0; HS._dprCap = 1.25; HS.resize(); }
    else if (this.low && this.goodT > 8) { this.low = 0; this.goodT = 0; HS._dprCap = 0; HS.resize(); }
  },

  /* ---------- 底部控制列 ---------- */
  renderBtns(force) {
    const stage = document.getElementById('stage'); if (!stage) return;
    let R = document.getElementById('cb35');
    if (!R) { R = document.createElement('div'); R.id = 'cb35'; stage.appendChild(R); force = true; }
    const sp = this.spd(), lock3 = !this.spdOk3();
    const sig = sp + '|' + lock3 + '|' + this.auto();
    if (force || R._sig !== sig) {
      R._sig = sig;
      R.innerHTML = `<button class="spd35 x${sp}" data-act="spd35" aria-label="戰鬥倍速">×${sp}<small>倍速</small></button>`
        + CFG.c35.skills.map((d, i) => `<button class="sk35 ${d.ult ? 'ult' : ''}" data-act="sk35" data-i="${i}" aria-label="${d.name}"><img src="${ASSETS[d.ic] || ''}" alt=""><i class="cdm"></i><b class="cdt"></b><span>${d.name}</span></button>`).join('')
        + `<button class="auto35 ${this.auto() ? 'on' : ''}" data-act="auto35" aria-label="自動施放">自動<small>${this.auto() ? '開' : '關'}</small></button>`;
      R._b = [...R.querySelectorAll('.sk35')];
    }
    R._b.forEach((b, i) => {
      const D = CFG.c35.skills[i], p = this.cds[i] / D.cd, txt = this.cds[i] > 0 ? Math.ceil(this.cds[i]) : '';
      const pk = Math.round(p * 60);
      if (b._p !== pk) { b._p = pk; b.style.setProperty('--p', p.toFixed(3)); b.classList.toggle('rdy', p <= 0); }
      const t = b.querySelector('.cdt'); if (t._t !== txt) { t._t = txt; t.textContent = txt; }
    });
  },
};

/* ---------- 掛鉤：時鐘（倍速＋頓幀） ---------- */
ANIM.clock = 0;
ANIM.now = function () { return this.clock; };
(() => {

    slots() { return C.slotLv.filter(l => S.lv >= l).length; },
    maxLv(star) { return 20 + 10 * (star || 0); },
    lvCost(id) { const x = POOL[id], o = WX.st().own[id]; if (!o) return null; const L = o.lv; return { wxpage: Math.ceil((2 + L * 0.8) * (1 + 0.35 * x.q)), copper: Math.round(250 * Math.pow(L, 1.6) * (1 + 0.2 * x.q)) /* 【建議調整 v3.11，數值 10/27 P2】L²→L^1.6，週一 90 天模擬複驗 */ }; },
    starCost(id) { const x = POOL[id], o = WX.st().own[id]; if (!o || o.star >= C.starMax) return null; const need = C.starNeed[o.star], use = Math.min(need, o.cp), miss = need - use; return { cp: use, need, stone: miss * C.stoneQ[x.q] }; },

    eqd() { const w = WX.st(), n = WX.slots(); return w.eq.slice(0, n).filter(id => id && w.own[id]); },

    best(traits) {   // 推薦：先依首領特性挑克制武學，再依戰力補滿

      (traits || []).forEach(t => { if (pick.length >= n) return; const id = own.find(i => !pick.includes(i) && POOL[i].tags.some(g => TR[t].c.includes(g))); if (id && !pick.some(p => POOL[p].tags.some(g => TR[t].c.includes(g)))) pick.push(id); });

CFG.c37 = {   // 【建議調整】v3.7 戰鬥節奏

  mobHp: 0.85,               // 小怪血量 ×0.85（3 → 2.55 單位）：普攻 3 下、暴擊 2 下、技能 1 下
  maxNums: 25,               // 同時存在的傷害數字上限
  mergeT: 0.12,              // 同一目標 0.12 秒內的小傷害合併成一個數字
  x3: { lv: 10, vip: 1 },    // ×3 倍速：江湖 Lv10、VIP1 或任一月卡（原：VIP1 或第二章）

  /** 產生（或取用快取）文字點陣圖；回傳 { cv, w, h } （CSS px） */

    const now = HS.T || 0;

      const m = this.a.find(n => n.t === 'n' && n.life > 0 && Math.abs(n.x0 - x) < 8 && now - n.born < CFG.c37.mergeT);

      let best = null; for (const q of this.a) if (q.t !== 'call' && (!best || (q.t === 'n') > (best.t === 'n') || ((q.t === 'n') === (best.t === 'n') && q.born < best.born))) best = q;
      n = best || this.a[0];

      if (now - (this._sqT || -9) > 0.35) this._sq = 0; else this._sq = ((this._sq || 0) + 1) % 4;
      this._sqT = now; y += this._sq * (crit ? 30 : 19);

    const dir = Math.random() < 0.5 ? -1 : 1;
    Object.assign(n, { t, x0: x, x: x + rnd(-14, 14), y: y, v, txt: extra && extra.txt ? extra.txt : (t === 'exp' ? '經驗 +' + fmtK(v) : t === 'miss' ? '閃避' : fmtK(v)), col: extra && extra.col,
      vx: call ? 0 : dir * rnd(crit ? 30 : 40, crit ? 80 : 110), vy: call ? 18 : t === 'exp' ? 70 : rnd(crit ? 120 : 110, crit ? 170 : 165), g: call ? 0 : t === 'exp' ? 40 : 300,
      life: call ? ((extra && extra.life) || 0.9) : crit ? 0.9 : t === 'exp' ? 0.85 : rnd(0.6, 0.75), born: now, pop: 0 });
    n.max = n.life; return n;
  },
  update(dt) {
    for (const n of this.a) { if (n.life <= 0) continue; n.life -= dt; n.pop += dt; n.vy -= n.g * dt; n.x += n.vx * dt; n.y += n.vy * dt; n.vx *= 1 - 1.6 * dt; }
    if (this.a.length && this.a.every(n => n.life <= 0)) this.a.length = 0;

  /** 【建議調整】v3.7.1 版面：每個數字先夾進戰鬥區，再與較早的數字錯開（往上讓，頂到上緣就往下），位置平滑移動不跳動 */
  layout(X, Y, s) {
    const W = HS.W || 390, z = this.zone(), bot = (HS.GY || 300) - 6, placed = [];
    const hit = (b, o) => Math.abs(b.x - o.x) < (b.gw + o.gw) && Math.abs(b.y - o.y) < (b.gh + o.gh);
    const inZ = b => C35.combo >= 3 && b.x + b.gw > z.cx0 && b.y - b.gh < z.cy1 + 2;
    const live = this.a.filter(n => n.life > 0).sort((p, q) => p.born - q.born);
    for (const n of live) {

      if (n.pop < 0.02 || n.oy == null) { n.ox = 0; n.oy = 0; }

      if (placed.some(o => hit(b, o)) || inZ(b)) {   // 找最近的空位：先試上下錯開，不行再左右錯開
        const ys = [b.y], xs = [b.x], cl = x => Math.max(b.gw / 0.8 + 4, Math.min(W - b.gw / 0.8 - 4, x));
        for (const o of placed) { ys.push(o.y - o.gh - b.gh - 1, o.y + o.gh + b.gh + 1); xs.push(cl(o.x - o.gw - b.gw - 1), cl(o.x + o.gw + b.gw + 1)); }

/* =====================================================================
 * v3.10.2 熱修（青鋒監管 10/26 QA N1；做法依智雅 10/26 裁決）
 *  斷網（對時失敗）＋手機時間 +1 天可以重複刷日常、掛機 8 小時、礦脈、簽到。
 *  存檔加 S.clk = { hw, lastResetKey, lastTrustedKey }（日期鍵用 dayIdx 遞增日序號）：
 *   1 只有 dayIdx(可信時間) > lastResetKey 才重置日常（調回同一天不會再刷）
 *   2 可信時間 < hw − 10 分鐘＝時間被往回調：不重置日常、不算掛機／礦脈，等真實時間追過 hw
 *   3 沒有可信時鐘（線上版對時失敗）時，最多比 lastTrustedKey 多重置 1 天；對時成功就更新 lastTrustedKey
 *   4 舊存檔遷移：hw＝現在、lastResetKey＝目前日常狀態那天（今天已重置＝今天，否則昨天）、lastTrustedKey＝lastResetKey
 *  可信時間一律用 fix_v394 的 QFTime（線上＝伺服器時間；離線最多比上次可信時間多一天）。
 * ===================================================================== */
(() => {
  const BACK = 10 * 60000;
  const T = () => (typeof QFTime === 'function' ? QFTime() : Date.now());
  const online = () => typeof CLK !== 'undefined' && CLK.ok;
  const hasSrv = () => typeof CLK !== 'undefined' && CLK.can();   // 線上版（有伺服器可對時）；本機檔案版只有手機時鐘
  const num = v => typeof v === 'number' && isFinite(v);

  const clk = () => {
    if (typeof S === 'undefined' || !S) return null;
    let c = S.clk;
    if (!c || typeof c !== 'object' || !num(c.hw) || !num(c.lastResetKey) || !num(c.lastTrustedKey)) {
      const t = T(), today = dayIdx(t);
      const k = num(S.dayMax) ? S.dayMax : dayIdxOfKey(S.day);
      const lr = k == null ? today - 1 : (k >= today ? Math.min(k, today + 1) : today - 1);
      c = S.clk = { hw: t, lastResetKey: lr, lastTrustedKey: lr };
    }
    return c;
  };
  const rewound = (c, t) => !!c && t < c.hw - BACK;
  const trust = c => { if (c && online()) c.lastTrustedKey = Math.max(c.lastTrustedKey, dayIdx(CLK.now())); };
  window.QFClk = { get: clk, rewound: () => { const c = clk(); return rewound(c, T()); } };

  /* ---------- 規則 1–3：每日重置 ---------- */
  const dr1 = dailyReset;
  dailyReset = function () {
    if (typeof S === 'undefined' || !S) return false;
    if (typeof CLK !== 'undefined' && CLK.pending) return false;
    const c = clk(), t = T(); trust(c);
    if (!num(S.dayMax)) { const k = dayIdxOfKey(S.day); S.dayMax = k == null ? dayIdx(t) - 1 : k; }   // 和 core.js 同一套 dayMax 遷移
    if (rewound(c, t)) return false;
    const it = dayIdx(t); let i = it;
    if (hasSrv() && !online()) i = Math.min(i, c.lastTrustedKey + 1);
    if (i <= c.lastResetKey) return false;
    const at = t - (it - i) * 864e5, rn = Date.now;
    let r; try { Date.now = () => at; r = dr1(); } finally { Date.now = rn; }
    if (r) c.lastResetKey = i;
    return r;
  };

  /* ---------- 規則 2：時間被往回調時不算掛機／礦脈 ---------- */
  if (typeof IdleManager !== 'undefined') {
    const mn = IdleManager.minutes, ma = IdleManager.mineAmount;
    IdleManager.minutes = function () { if (rewound(clk(), T())) return 0; return mn.apply(this, arguments); };
    IdleManager.mineAmount = function () { if (rewound(clk(), T())) return 0; return ma.apply(this, arguments); };
  }

  /* ---------- 對時成功：更新 lastTrustedKey；調快過的時間還沒被真實時間追上前，不把掛機／礦脈起點拉回 ---------- */
  if (typeof CLK !== 'undefined') {
    const rs0 = CLK.resync;
    CLK.resync = function () {
      const c = clk(); const keep = {};
      if (S && S.idle) keep.idle = S.idle.last;
      if (S && S.mines) { keep.m = {}; Object.keys(S.mines).forEach(k => { if (S.mines[k]) keep.m[k] = S.mines[k].last; }); }
      const r = rs0.apply(this, arguments);
      try {
        trust(c);
        if (c && rewound(c, this.now())) {
          if (S.idle && num(keep.idle)) S.idle.last = Math.max(S.idle.last || 0, keep.idle);
          if (keep.m) Object.keys(keep.m).forEach(k => { if (S.mines[k] && num(keep.m[k])) S.mines[k].last = Math.max(S.mines[k].last || 0, keep.m[k]); });
        }
      } catch (e) { }
      return r;
    };
  }

  /* ---------- 存檔時 hw＝max(hw, 可信時間) ---------- */
  const sv1 = SaveManager.save;
  SaveManager.save = function () {
    try { const c = clk(); if (c) { trust(c); c.hw = Math.max(c.hw, T()); } } catch (e) { }
    return sv1.apply(this, arguments);
  };
})();

// v3.8 觸控熱區：手機上所有可點元素的有效點擊範圍至少 44×44（不改外觀，用透明偽元素向外擴張）
const TOUCH = {
  MIN: 44, n: 0,
  fix(root) {
    const marked = [];
    (root || document).querySelectorAll(':is([data-act],button):not([data-t44])').forEach(e => {
      if ( e.tagName === 'INPUT' || e.tagName === 'SELECT') return;
      const b = e.getBoundingClientRect(); if (!b.width || !b.height) return;
      if (b.width >= this.MIN && b.height >= this.MIN) { e.dataset.t44 = '0'; return; }
      const cs = getComputedStyle(e);
      const freeB = getComputedStyle(e, '::before').content, freeA = getComputedStyle(e, '::after').content;
      const cls = (!freeB || freeB === 'none') ? 'b' : (!freeA || freeA === 'none') ? 'a' : null; if (!cls) { e.dataset.t44 = 'x'; return; }
      if (cs.position === 'static') e.style.position = 'relative';
      e.style.setProperty('--hx', Math.ceil(Math.max(0, (this.MIN + 2 - (e.clientWidth || b.width)) / 2)) + 'px');
      e.style.setProperty('--hy', Math.ceil(Math.max(0, (this.MIN + 2 - (e.clientHeight || b.height)) / 2)) + 'px');
      e.dataset.t44 = cls; this.n++; marked.push(e);
    });
    // 擴張後若蓋住鄰近按鈕本體，讓被蓋住的按鈕浮在上層（本體優先）
    if (!marked.length) return;
    const R = marked.map(m => { const r = m.getBoundingClientRect(); return [r.left - 22, r.top - 22, r.right + 22, r.bottom + 22]; });
    document.querySelectorAll('[data-act],button').forEach(e => {
      const b = e.getBoundingClientRect(); if (!b.width) return;
      if (!R.some(q => b.right > q[0] && b.left < q[2] && b.bottom > q[1] && b.top < q[3])) return;
      const t = document.elementFromPoint(b.left + b.width / 2, b.top + b.height / 2); const o = t && t.closest('[data-act],button');
      if (o && o !== e && !o.contains(e) && !e.contains(o)) { if (getComputedStyle(e).position === 'static') e.style.position = 'relative'; e.style.zIndex = (parseInt(getComputedStyle(o).zIndex) || 0) + 1; }
    });
  },
  init() {
    const st = document.createElement('style');
    st.textContent = `[data-t44="b"]::before,[data-t44="a"]::after{content:'';position:absolute;left:calc(-1*var(--hx));right:calc(-1*var(--hx));top:calc(-1*var(--hy));bottom:calc(-1*var(--hy));background:transparent;pointer-events:auto}
label.chk{min-height:44px;align-items:center;cursor:pointer}label.chk input[type=checkbox]{width:22px;height:22px;margin-right:6px}`;
    document.head.appendChild(st);
    const run = () => { try { this.fix(); } catch (e) {} };
    // 觀察者回呼在畫面繪製前執行，新產生的按鈕一出現就有熱區
    new MutationObserver(run).observe(document.body, { childList: true, subtree: true });
    run();
  },
};
if (document.body) TOUCH.init(); else addEventListener('DOMContentLoaded', () => TOUCH.init());

boot();
</script>
</body></html>
