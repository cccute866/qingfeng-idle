<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f4a44">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%94%3C/text%3E%3C/svg%3E">
<title>青鋒閒俠錄 · 原創武俠放置</title>
<style>/* 青鋒閒俠錄 v2 — 羊皮紙＋玉青＋金 · 原創介面 */
:root{--ink:#3b2a16;--ink2:#6b5233;--paper:#f6e9c8;--paper2:#ecd9ab;--jade:#178f7c;--jade2:#0d6457;--jade3:#5fd6b8;--gold:#e7b443;--gold2:#ffdc7a;--red:#e2523f;--text:#3b2a16;--dim:#7a6545;
--q0:#9aa5a0;--q1:#4fbf6a;--q2:#4a8dff;--q3:#a35cff;--q4:#f5b82e;--q5:#ff4d3d;--ease:cubic-bezier(.2,.9,.25,1.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b2f2c;color:var(--text);font-family:"Noto Sans CJK TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;user-select:none}
button{font-family:inherit}
#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 50px #000;
 background:radial-gradient(120% 60% at 50% 0%,#fff7df 0%,transparent 60%),repeating-linear-gradient(0deg,#0000 0 3px,#a07a3a08 3px 4px),linear-gradient(#f3e3bb,#e9d4a4)}
.ic{width:1.25em;height:1.25em;vertical-align:-.28em;object-fit:contain;display:inline-block}
svg.ic,i>svg{width:1.25em;height:1.25em;vertical-align:-.28em}
/* ---------- 舞台 + 頂部 HUD ---------- */
#stage{position:relative;flex:none;height:92px;overflow:hidden;background:linear-gradient(#0f5a51,#0b3f3a);transition:height .45s var(--ease);border-bottom:3px solid var(--gold);box-shadow:0 3px 12px #0005;z-index:2}
#app.home #stage{height:48%}
#hcv{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .4s}
#app.home #hcv{opacity:1}
#hdr{position:absolute;left:0;right:0;top:0;padding:8px 10px 0;background:linear-gradient(#08302cdd,#08302c99 70%,#0000);color:#fff;z-index:3}
.hrow{display:flex;align-items:center;gap:8px}
.avatar{width:72px;height:72px;margin:-2px 0 -4px;border-radius:50%;position:relative;flex:none;cursor:pointer;filter:drop-shadow(0 2px 3px #0008)}
.avatar img{width:100%;height:100%;object-fit:contain}
.avatar .lv{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);background:linear-gradient(#ffe9a8,#e7b443 55%,#b57a1c);border:2px solid #fff6d8;border-radius:11px;font-size:13px;font-weight:900;padding:1px 9px;color:#4a2a08;box-shadow:0 2px 4px #0007;white-space:nowrap;z-index:2;text-shadow:0 1px 0 #fff8}
.avatar .lv::before{content:'Lv';font-size:9px;margin-right:1px}
.pinfo{flex:1;min-width:0}
.pname{font-weight:900;font-size:14px;display:flex;gap:6px;align-items:center;text-shadow:0 1px 2px #000}
.vipb{background:linear-gradient(#ffe9a0,#d99a1a);color:#4a2a00;font-size:10px;font-weight:900;padding:1px 6px;border-radius:8px;cursor:pointer;border:1px solid #fff6}
.power{font-size:14px;color:var(--gold2);font-weight:900;text-shadow:0 1px 0 #000,0 0 8px #e7b44366;display:flex;align-items:center;gap:3px}
.power b{font-size:15px}
.expbar{height:5px;background:#0008;border-radius:3px;overflow:hidden;margin-top:3px;width:80%}
.expbar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade3),#d6fff2)}
.hbtns{display:flex;gap:4px}
.iconbtn{background:#0d3e39cc;border:1.5px solid #e7b44399;color:#fff;border-radius:12px;padding:4px 7px;font-size:16px;cursor:pointer;line-height:1}
.title .iconbtn{background:linear-gradient(#1d8b78,#0c5248);font-size:14px}
.res{display:flex;gap:4px;margin-top:5px}
.res .r{flex:1 1 0;min-width:0;background:#062724bb;border:1px solid #ffffff22;border-radius:12px;padding:2px 6px 2px 3px;font-size:12px;display:flex;align-items:center;gap:3px;white-space:nowrap;transition:transform .2s}
.res .r .ic,.res .r svg{width:18px;height:18px}
.res .r b{font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis}
.res .r.bump{animation:bump .35s var(--ease)}
@keyframes bump{40%{transform:scale(1.18);background:#e7b44388}}
#app:not(.home) #shud,#app:not(.home) #hbanner{display:none}
#shud{position:absolute;left:10px;right:10px;top:118px;z-index:3}
.sprog{position:relative;background:#062724b0;border:1.5px solid #e7b44388;border-radius:14px;padding:4px 50px 6px 10px;color:#fff}
.sprog .lbl{font-size:12px;font-weight:900;text-shadow:0 1px 2px #000}
.sprog .lbl small{font-weight:700;color:#bfe;margin-left:6px}
.sprog .track{height:8px;background:#0009;border-radius:5px;overflow:hidden;margin-top:3px}
.sprog .track i{display:block;height:100%;background:linear-gradient(90deg,#2fc7a8,#bfffee,#ffdc7a);transition:width .35s var(--ease);box-shadow:0 0 8px #7ff5d8}
.bossic{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:radial-gradient(#5b1d1d,#2a0a0a);border:2.5px solid var(--gold);overflow:hidden;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;filter:grayscale(.6) brightness(.8)}
.bossic img{width:120%;margin-bottom:-14px}
.bossic.glow{filter:none;animation:bglow .9s infinite alternate}
@keyframes bglow{from{box-shadow:0 0 4px #ff6b3d}to{box-shadow:0 0 18px 4px #ffb03d}}
.sprog.boss{padding-right:10px}
.bhp,.php2{height:9px;background:#0009;border-radius:5px;overflow:hidden;margin-top:3px}
.bhp i{display:block;height:100%;background:linear-gradient(90deg,#ff4a3a,#ffa36b);transition:width .2s}
.php2{height:6px}.php2 i{display:block;height:100%;background:linear-gradient(90deg,#2fd27a,#bfffcf);transition:width .2s}
.btn.bossbtn{position:absolute;right:0;top:56px;display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:15px!important;padding:6px 14px!important}
.bossbtn small{font-size:10px;font-weight:700;opacity:.9}
.btn.warnb{filter:saturate(.6)}
#hbanner{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:26px;font-weight:900;color:var(--gold2);text-shadow:0 0 14px #e7b443,0 3px 0 #5a3a00;pointer-events:none;opacity:0;z-index:3;letter-spacing:2px}
#hbanner.show{animation:lvup 1.6s forwards}
/* ---------- 目標 ---------- */
#goal{position:relative;z-index:3;margin:-14px 10px 0;padding:6px 8px 6px 6px;border-radius:14px;background:linear-gradient(#fff4d6,#f1dca8);border:2px solid var(--gold);display:flex;align-items:center;gap:8px;font-size:13px;box-shadow:0 4px 10px #3b2a1640;flex:none}
#goal .gi{width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(#1d8b78,#0c5248);border-radius:50%;border:2px solid var(--gold2)}
#goal .gi .ic,#goal .gi svg{width:20px;height:20px}
#goal .gt{flex:1;min-width:0}
#goal .gt b{color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal .gt small{display:block;color:var(--ink2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#goal.done{animation:glow 1s infinite alternate}
@keyframes glow{from{box-shadow:0 0 3px #e7b443}to{box-shadow:0 0 16px #ffd36b}}
/* ---------- 主區 ---------- */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 14px;scrollbar-width:thin}
#main.vin>*{animation:vin .32s var(--ease) backwards}
#main.vin>*:nth-child(2){animation-delay:.04s}#main.vin>*:nth-child(3){animation-delay:.08s}#main.vin>*:nth-child(4){animation-delay:.12s}
@keyframes vin{from{opacity:0;transform:translateY(14px)}}
/* ---------- 導航 ---------- */
/* #nav v3.3.1 → 見檔尾「v3.3.1 底部導覽」 */
.dot{position:absolute;top:2px;right:calc(50% - 20px);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9c8a,#d92d1d);border:1.5px solid #fff;display:none;z-index:2;box-shadow:0 1px 2px #0006}
.dot.on{display:block;animation:dotb 1.4s infinite}
@keyframes dotb{50%{transform:scale(1.25)}}
/* ---------- 通用元件 ---------- */
.title{font-size:18px;font-weight:900;margin:2px 0 10px;display:flex;align-items:center;gap:8px;color:#fff;background:linear-gradient(90deg,#0d6457,#178f7c 70%,#178f7c00);padding:5px 10px;border-radius:12px;text-shadow:0 2px 0 #0006;border-left:4px solid var(--gold)}
.title .sub{color:#d8f5ec}
.has-title_banner .title{background:var(--title-banner) center/100% 100% no-repeat;border:none;justify-content:center;padding:8px 40px 12px;border-radius:0;position:relative}
.has-title_banner .title .back{position:absolute;left:0;top:5px}
.sub{font-size:12px;color:var(--dim)}
.card{background:linear-gradient(#fbf2da,#f2e2b9);border:2px solid #d9b56b;border-radius:16px;padding:10px;margin-bottom:9px;box-shadow:0 3px 0 #b8925066,0 4px 10px #3b2a1622;position:relative}
.has-card_frame .card{border:22px solid transparent;border-image:var(--card-frame) 24% fill / 22px;padding:0;box-shadow:none;border-radius:0;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.btn{position:relative;background:linear-gradient(#ffb53d,#f07a12);color:#fff;border:2px solid #ffe7a0;border-radius:12px;padding:7px 14px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 3px 0 #9a4a08;white-space:nowrap;text-shadow:0 1px 1px #7a3200,0 0 2px #7a3200;transition:transform .12s}
.btn:active{transform:translateY(2px) scale(.97)}
.btn.jade{background:linear-gradient(#3fd2ad,#0f8a72);box-shadow:0 3px 0 #0a4f43;text-shadow:0 1px 1px #04352c}
.btn.gray,.btn:disabled{background:linear-gradient(#b9b2a1,#8c8574);box-shadow:0 3px 0 #5e5747;cursor:not-allowed;text-shadow:0 1px 1px #444}
.btn.red{background:linear-gradient(#ff8a72,#d23a26);box-shadow:0 3px 0 #7a1d10}
.has-btn_primary .btn{border:2px solid transparent;border-image:var(--btn-primary) 44% 21% fill / 15px 20px;background:none;box-shadow:none;border-radius:0}
.has-btn_secondary .btn.jade{border-image-source:var(--btn-secondary)}
.has-btn_disabled .btn.gray,.has-btn_disabled .btn:disabled{border-image-source:var(--btn-disabled)}
.btn.red{border-image:none!important;border:2px solid #ffd0c0!important;border-radius:12px!important;background:linear-gradient(#ff8a72,#d23a26)!important}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.big{padding:10px 20px;font-size:16px}
.btn .dot{top:-4px;right:-4px}
.sim{display:inline-block;font-size:10px;background:#d92d1d;color:#fff;border-radius:6px;padding:0 4px;margin-left:4px;vertical-align:middle;text-shadow:none}
.tag{display:inline-block;font-size:10px;border-radius:6px;padding:0 5px;background:#178f7c22;border:1px solid #178f7c66;color:var(--jade2);font-weight:700}
.tag.gold{background:#e7b44333;border-color:#e7b443;color:#8a5a00}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bar{height:10px;background:#3b2a1630;border-radius:6px;overflow:hidden;position:relative;box-shadow:inset 0 1px 2px #0003}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--jade),#7ff0d0);transition:width .4s var(--ease)}
.bar.gold i{background:linear-gradient(90deg,#e0962a,#ffe08a)}
.hint{font-size:11px;color:var(--ink2);background:#fff8e2;border:1px dashed #d4ae62;border-radius:10px;padding:6px 8px;margin:6px 0}
.tips{font-size:12px;background:#fff8e2;border:1px solid #d4ae62;border-radius:10px;padding:8px;margin:6px 0;line-height:1.7}
.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.green{color:#1c9a4c}.redt{color:#d2392a}.goldt{color:#b5780a}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv>span:nth-child(odd){color:var(--dim)}
.kv b{color:#9a5c00}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{flex:1;background:#fff3d4;border:1.5px solid #d4ae62;color:var(--ink2);border-radius:10px;padding:6px;font-size:12px;font-weight:800;cursor:pointer}
.tabs button.on{background:linear-gradient(#22a088,#0d6457);color:#fff;border-color:var(--gold)}
table.t{width:100%;border-collapse:collapse;font-size:11px}
table.t td,table.t th{border-bottom:1px solid #b8925044;padding:4px 3px;text-align:center}
table.t tr.cur{background:#e7b44344}
.list .li{display:flex;align-items:center;gap:8px;padding:8px;border-radius:12px;background:#fff6dc;border:1px solid #e3c88c;margin-bottom:6px}
.li .ic,.li>span>svg{width:26px;height:26px}
.li.paid{background:linear-gradient(90deg,#ffe2a6,#fff6dc);border-color:var(--gold)}
.li.claimed{opacity:.45}
/* ---------- 物品 / 品質框 ---------- */
.it{position:relative;width:100%;aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2.5px solid;background:#fff;box-shadow:inset 0 0 0 2px #fff8,0 2px 3px #0003;overflow:hidden}
.it>.ic,.it>svg{width:62%;height:62%;position:relative;z-index:1;filter:drop-shadow(0 2px 1px #0004)}
.it .qfr{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.it>.ic,.it>svg,.it>img:not(.qfr){position:relative;z-index:1;width:68%;height:68%;filter:drop-shadow(0 2px 1px #0005)}
.it:has(.qfr){border-color:transparent;background:none;box-shadow:none}
.it .lv{position:absolute;bottom:2px;right:5px;font-size:10px;color:#fff;font-weight:800;text-shadow:0 0 2px #000,0 0 2px #000;z-index:3}
.it .en{position:absolute;top:2px;left:5px;font-size:10px;color:#ffe680;font-weight:900;text-shadow:0 0 2px #000,0 0 2px #000;z-index:3}
.it .up{position:absolute;top:1px;right:4px;font-size:12px;color:#2bd65a;font-weight:900;text-shadow:0 0 2px #fff;z-index:3;animation:pulse 1s infinite}
.it.empty{border:2px dashed #b89250;background:#fff5;opacity:.7}
.q0{border-color:var(--q0)}.q1{border-color:var(--q1)}.q2{border-color:var(--q2)}.q3{border-color:var(--q3)}.q4{border-color:var(--q4)}.q5{border-color:var(--q5)}
.qb0{background:radial-gradient(#ffffff,#d8dcd8)}.qb1{background:radial-gradient(#eaffef,#9fe0ad)}.qb2{background:radial-gradient(#eaf3ff,#9cc0ff)}.qb3{background:radial-gradient(#f6ecff,#c7a0ff)}.qb4{background:radial-gradient(#fff6db,#ffcf6a)}.qb5{background:radial-gradient(#ffe8e4,#ff8a7a);animation:glow 1.2s infinite alternate}
.qt1{color:#2b9a48}.qt2{color:#2f6fe0}.qt3{color:#8a3ee6}.qt4{color:#c98400}.qt5{color:#e0301e}.qt0{color:#7c8682}
/* ---------- 俠客 ---------- */
.hero{position:relative;border-radius:16px;padding:6px 4px;text-align:center;cursor:pointer;background:linear-gradient(#fffaf0,#f3e3bd);border:2.5px solid;box-shadow:0 2px 4px #3b2a1630;transition:transform .15s}
.hero:active{transform:scale(.96)}
.hface{width:54px;height:54px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;text-shadow:0 2px 0 #0007;position:relative;border:3px solid var(--gold)}
.hface.img{border:none;background:none}
.hface.img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 2px #0005)}
.stars{font-size:10px;color:#e09a00;letter-spacing:-1px;min-height:13px;text-shadow:0 0 1px #6a4000}
.hero .nm{font-size:12px;font-weight:900}
.hero.off{opacity:.5;filter:grayscale(.85)}
.hero .badge{position:absolute;top:3px;left:4px;font-size:10px;background:var(--jade);color:#fff;border-radius:6px;padding:0 4px;font-weight:800;z-index:2}
/* ---------- 俠客居（下半面板） ---------- */
.homep{display:flex;flex-direction:column;gap:9px}
.eqstrip{display:flex;gap:8px;align-items:stretch;background:linear-gradient(#fdf6e3,#f1e0b6);border:2px solid #d9b56b;border-radius:16px;padding:8px;box-shadow:0 3px 0 #b8925055}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1}
.eslot{position:relative}
.eslot.empty{aspect-ratio:1;border:2px dashed #b89250;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--dim);cursor:pointer;background:#fff6}
.eslot.empty .ic,.eslot.empty svg{width:50%;height:50%;opacity:.45;filter:grayscale(1)}
.eqside{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;width:96px}
.team{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.tm{position:relative;cursor:pointer}
.tm .st{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:9px;font-style:normal;font-weight:900;color:#fff;background:#0d6457;border-radius:6px;padding:0 3px;white-space:nowrap}
.chestcard{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#fff3d0,#f7e2ae);border:2px solid var(--gold);border-radius:16px;padding:7px 10px;cursor:pointer;box-shadow:0 3px 0 #b8925055}
.chestcard .cic{width:46px;height:46px;flex:none}
.chestcard .cic .ic,.chestcard .cic svg{width:100%;height:100%}
.chestcard.ready .cic{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(-5deg)}}
.chestcard .sub{font-size:11px;margin:1px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chestcard .sub .ic,.chestcard .sub svg{width:14px;height:14px}
.cta{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;cursor:pointer;color:#fff;background:radial-gradient(120% 140% at 0% 0%,#4fe0c0,#0f8a72 45%,#094d43);border:2.5px solid var(--gold2);box-shadow:0 4px 0 #063a33,0 0 18px #2fc7a855;overflow:hidden}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,#ffffff44 45%,transparent 60%);animation:shine 2.8s infinite}
@keyframes shine{from{transform:translateX(-100%)}60%,to{transform:translateX(100%)}}
.cta .cta-ic{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 6px #bfffee)}
.cta .cta-ic .ic,.cta .cta-ic svg{width:100%;height:100%}
.cta b{font-size:18px;letter-spacing:2px;text-shadow:0 2px 0 #053a32}
.cta small{display:block;font-size:11px;opacity:.9}
.cta .go{background:linear-gradient(#ffd56b,#f08a1a);color:#5a2a00;font-weight:900;border-radius:12px;padding:6px 12px;border:2px solid #fff3c0;text-shadow:none}
.cta .dot{top:6px;right:6px}
.rbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.rbtn{position:relative;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:900;color:var(--ink);padding:0}
.rbtn i{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#5fe6c4,#0f8a72 60%,#08524a);border:2.5px solid var(--gold);box-shadow:0 3px 0 #063a33;transition:transform .15s var(--ease)}
.has-btn_round .rbtn i{background:var(--btn-round) center/100% 100%;border:none;box-shadow:0 3px 4px #0004}
.rbtn i .ic,.rbtn i svg{width:58%;height:58%;filter:drop-shadow(0 1px 1px #0006)}
.rbtn:active i{transform:scale(.9)}
.rbtn small{font-size:9px;color:var(--dim)}
.rbtn .dot{top:0;right:calc(50% - 26px)}
/* ---------- 地圖 ---------- */
.mapv{position:relative;width:100%;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#cfe7d4 center/100% 100% no-repeat;border:3px solid var(--gold);box-shadow:0 4px 14px #3b2a1640;
 background-image:radial-gradient(circle at 30% 30%,#9fd8b5,transparent 40%),radial-gradient(circle at 70% 70%,#8fd0d8,transparent 45%),linear-gradient(#e9f3df,#cfe5cf)}
.mapttl{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:linear-gradient(#1d9b84,#0d6457);color:#fff;font-weight:900;font-size:16px;padding:4px 22px;border-radius:14px;border:2px solid var(--gold2);letter-spacing:3px;text-shadow:0 2px 0 #0005;white-space:nowrap;z-index:2}
.has-title_banner .mapttl{background:var(--title-banner) center/100% 100%;border:none;padding:6px 44px 12px}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:1;transition:transform .2s var(--ease)}
.spot:active{transform:translate(-50%,-50%) scale(.92)}
.spot .pin{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5fe6c4,#0f8a72 60%,#08524a);border:2.5px solid var(--gold2);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px #0006,0 0 0 4px #ffffff55;animation:float 2.4s ease-in-out infinite}
.spot .pin .ic,.spot .pin svg{width:62%;height:62%}
.spot .lab{margin-top:3px;background:linear-gradient(#fff8e4,#f0dcaa);border:1.5px solid var(--gold);border-radius:10px;padding:2px 9px;text-align:center;box-shadow:0 2px 4px #0004;white-space:nowrap}
.spot .lab b{display:block;font-size:13px;color:var(--ink)}
.spot .lab small{display:block;font-size:10px;color:var(--jade2);font-weight:700}
.spot.lock .pin{filter:grayscale(1) brightness(.8);animation:none}
.spot.lock .lab{opacity:.75}
.spot .dot{top:-2px;right:-2px}
@keyframes float{50%{transform:translateY(-4px)}}
.gport{width:64px;height:64px;flex:none;border-radius:14px;background:radial-gradient(#7a2d2d,#2a0a0a);border:2px solid var(--gold);overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.gport img{width:110%}
/* ---------- 彈窗：羊皮紙＋玉青標題列 ---------- */
#modal{position:absolute;inset:0;background:#06201ccc;display:none;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(2px)}
#modal.on{display:flex}
.mbox{position:relative;width:100%;max-height:86%;overflow:auto;background:linear-gradient(#fbf2da,#f0deb2);border:2.5px solid var(--gold);border-radius:18px;padding:0 14px 14px;box-shadow:0 12px 40px #000a;color:var(--ink)}
.mbox.pop{animation:pop .3s var(--ease)}
.mtitle{margin:0 -14px 10px;background:linear-gradient(#1d9b84,#0d6457);border-bottom:2px solid var(--gold);color:#fff;text-align:center;font-weight:900;font-size:16px;padding:8px 10px;letter-spacing:1px;text-shadow:0 2px 0 #0005;position:sticky;top:0;z-index:2}
.has-panel_title .mbox{background:none;border-radius:0;border:solid transparent;border-width:64px 26px 30px;border-image:var(--panel-title) 29.9% 24% 23.9% fill / 64px 26px 30px;padding:0 4px 4px;box-shadow:none;filter:drop-shadow(0 10px 24px #000a);overflow:visible;max-height:none}
.has-panel_title .mbox>.mbody{max-height:70vh;overflow:auto}
.has-panel_title .mtitle{background:none;border:none;margin:-60px -10px 22px;padding:0;height:24px;line-height:24px;position:relative}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.mbox h3{margin:0 0 8px;color:var(--jade2);text-align:center}
.rewards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.rw{background:#fff8e6;border:1.5px solid var(--gold);border-radius:12px;padding:4px 9px;font-size:13px;font-weight:700;animation:pop .35s var(--ease) backwards;box-shadow:0 2px 0 #b8925066}
.seal{width:76px;height:76px;margin:4px auto;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#fff;background:radial-gradient(#ff7a5a,#b2261a);border:3px solid #ffd9a0;transform:rotate(-8deg);animation:rat .5s var(--ease)}
.seal.fail{background:radial-gradient(#8a8a8a,#4a4a4a)}
.seal.rS{background:radial-gradient(#ffe36a,#d88a00);text-shadow:0 2px 0 #7a4b00}.seal.rA{background:radial-gradient(#d0a0ff,#7a3ad6)}.seal.rB{background:radial-gradient(#9cc8ff,#2f6fe0)}.seal.rC{background:radial-gradient(#d0d6d4,#7c8682)}
.rimg{display:block;width:110px;height:110px;margin:0 auto;animation:rat .6s var(--ease)}
#toast{position:absolute;left:50%;top:110px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.tst{background:linear-gradient(#0f6b5fee,#0a4139ee);color:#fff;border:1.5px solid var(--gold2);border-radius:14px;padding:6px 14px;font-size:13px;font-weight:700;animation:tst 2.2s forwards;white-space:nowrap;box-shadow:0 4px 10px #0005}
@keyframes tst{0%{opacity:0;transform:translateY(10px) scale(.9)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.lvup{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:90;font-size:38px;font-weight:900;color:var(--gold2);text-shadow:0 0 20px #e7b443,0 3px 0 #6b4300;animation:lvup 1.6s forwards}
@keyframes lvup{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{opacity:0;transform:translateY(-40px)}}
@keyframes rat{from{transform:scale(2.6) rotate(-20deg);opacity:0}to{opacity:1}}
/* ---------- 魂器試煉 列表 / 塔 ---------- */
.layers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.layer{border-radius:10px;padding:6px 0;text-align:center;font-size:12px;font-weight:900;background:#fff6dc;border:2px solid #d9b56b;cursor:pointer;position:relative;color:var(--ink)}
.layer .ic,.layer svg{width:12px;height:12px}
.layer.cur{border-color:var(--jade);background:#d9f5ea}
.layer.lock{opacity:.4}
.layer.sel{outline:3px solid var(--gold);transform:scale(1.05)}
.layer .rt{display:block;font-size:10px}
.rt.rS{color:#d88a00}.rt.rA{color:#8a3ee6}.rt.rB{color:#2f6fe0}.rt.rC{color:#7c8682}
.tower{display:flex;flex-direction:column-reverse;gap:4px;align-items:center;margin-bottom:8px}
.tfl{width:72%;padding:6px;border-radius:10px;text-align:center;font-size:12px;background:#fff6dc;border:1.5px solid #d9b56b;display:flex;align-items:center;justify-content:center;gap:4px}
.tfl.cur{background:linear-gradient(#3fd2ad,#0f8a72);color:#fff;font-weight:900;width:88%;border-color:var(--gold2)}
.tfl.done{opacity:.55}
.chk{gap:4px;white-space:nowrap}
/* ---------- 戰鬥（上：舞台 / 下：操作面板） ---------- */
#battle{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;background:#0a2a27}
#battle.on{display:flex;animation:vin .35s var(--ease)}
#bstage{position:relative;flex:0 0 58%;overflow:hidden;border-bottom:3px solid var(--gold)}
#bcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.btop{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:6px;align-items:center;pointer-events:none}
.timer{font-size:20px;font-weight:900;color:#fff;text-shadow:0 2px 0 #000;min-width:62px;text-align:center;background:#062724c0;border:1.5px solid var(--gold);border-radius:12px;padding:0 8px}

.hpb u{position:absolute;left:0;top:0;bottom:0;background:#9ad8ffaa}
.combo{position:absolute;right:12px;top:84px;font-size:24px;font-weight:900;color:var(--gold2);text-shadow:0 0 10px #f0a020,0 2px 0 #000;pointer-events:none}
.bmsg{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:28px;font-weight:900;color:var(--gold2);text-shadow:0 0 16px #e7b443,0 3px 0 #6b4300;pointer-events:none;opacity:0}

#bpanel{flex:1;display:flex;flex-direction:column;gap:6px;padding:8px 12px 10px;background:radial-gradient(120% 60% at 50% 0%,#fff7df,transparent 60%),linear-gradient(#f3e3bb,#e6cf9b);position:relative;color:var(--ink)}
.brow{display:flex;align-items:center;gap:8px}
.brow label{font-size:12px;font-weight:900;width:30px;color:var(--jade2)}
.php,.ebar{flex:1;height:16px;background:#3b2a1640;border:2px solid #b89250;border-radius:9px;overflow:hidden;position:relative}
.php i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2fbf6a,#9affb0);transition:width .15s}
.php b,.ebar b{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
.ebar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2fc7a8,#9affea,#ffdc7a);transition:width .2s}
.ebar i.full{box-shadow:0 0 10px #ffdc7a;animation:glow .6s infinite alternate}
.ebar .m100{position:absolute;top:0;bottom:0;left:66.6%;width:2px;background:#fff}
.bacts{flex:1;display:flex;align-items:center;justify-content:center;gap:16px;min-height:96px}
.bact{--cd:0;position:relative;width:76px;height:76px;border-radius:50%;border:3px solid var(--gold2);color:#fff;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#5fe6c4,#0f8a72 60%,#08524a);box-shadow:0 4px 0 #063a33,0 0 14px #2fc7a855;overflow:hidden;touch-action:none;text-shadow:0 1px 2px #0008}
.bact.big{width:92px;height:92px;background:radial-gradient(circle at 35% 30%,#ffd56b,#f08a1a 60%,#a04a00);box-shadow:0 4px 0 #6a3000,0 0 16px #ffb03d66}
.bact::after{content:"";position:absolute;inset:0;background:conic-gradient(#000a calc(var(--cd)*360deg),transparent 0)}
.bact i .ic,.bact i svg{width:28px;height:28px}
.bact span{font-size:14px;line-height:1.1}
.bact small{font-size:8px;opacity:.85;font-weight:700}
.bact.hit{animation:bhit .25s var(--ease)}
@keyframes bhit{40%{transform:scale(.86)}}
#bportal{display:none;position:absolute;left:50%;top:-58px;transform:translateX(-50%);z-index:3;background:radial-gradient(circle at 50% 30%,#d6b0ff,#7a3ad6 60%,#3a1470);color:#fff;border:2.5px solid var(--gold2);border-radius:20px;padding:8px 18px;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 0 20px #b07aff;align-items:center;gap:6px;animation:pulse .8s infinite;white-space:nowrap}
#bportal.on{display:flex}
#bportal small{font-size:10px;opacity:.8}
#bportal i .ic,#bportal i svg{width:22px;height:22px}
.bctl{display:flex;gap:6px;justify-content:center}
.bctl button{background:#fff6dc;color:var(--ink);border:1.5px solid #b89250;border-radius:12px;padding:5px 10px;font-size:12px;font-weight:800;cursor:pointer}
.bctl button.on{background:linear-gradient(#3fd2ad,#0f8a72);color:#fff;border-color:var(--gold)}
#bresult{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:12px;overflow:auto;z-index:5}
#bresult:not(:empty){pointer-events:auto;background:#06201cc0}
#bresult .mbox{animation:pop .35s var(--ease)}
.sbars{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.sbar{display:flex;align-items:center;gap:6px;font-size:12px}
.sbar span{width:56px;color:var(--dim)}
.sbar i{flex:1;height:8px;background:#3b2a1630;border-radius:5px;overflow:hidden}
.sbar i b{display:block;height:100%;background:linear-gradient(90deg,var(--jade),#ffdc7a);animation:grow .8s var(--ease) backwards}
.sbar em{font-style:normal;width:42px;text-align:right;font-weight:800}
@keyframes grow{from{width:0!important}}
.dmgf{position:absolute;font-weight:900;color:#fff;text-shadow:0 2px 0 #000;animation:dmgf .8s forwards;pointer-events:none}
@keyframes dmgf{to{transform:translateY(-30px);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (max-height:700px){#app.home #stage{height:44%}.bacts{min-height:80px}.bact{width:64px;height:64px}.bact.big{width:78px;height:78px}}

/* 品質分布條 / 評價徽章 / 結算橫幅（素材：quality_bar_*, badge_*, result_banner） */
.qdist{min-width:150px}

.qc0{--qc:var(--q0)}.qc1{--qc:var(--q1)}.qc2{--qc:var(--q2)}.qc3{--qc:var(--q3)}.qc4{--qc:var(--q4)}.qc5{--qc:var(--q5)}
.qleg{font-size:10px;margin-top:2px;font-weight:800}
.hero .hqb{position:absolute;left:10%;right:10%;top:3px;height:6px;border-radius:3px;background-size:100% 100%;z-index:1}
.layer .bdg{display:block;margin:1px auto 0;filter:drop-shadow(0 1px 1px #0004)}
.bdg{vertical-align:middle}
.mbox.hasban{padding-top:6px}
.rban{position:relative;margin:-20px -16px 6px;text-align:center;animation:pop .45s var(--ease)}

.avatar img{border-radius:50%;background:radial-gradient(#fff4d6,#e9c879);border:3px solid #f6d77a;box-shadow:0 0 0 2px #7a4b12,0 0 12px #ffd76a88;box-sizing:border-box}
.avatar .afr{position:absolute;inset:-5px;border-radius:50%;border:2px dashed #ffe9a855;animation:spin 18s linear infinite;pointer-events:none}

.res .r.stam{cursor:pointer;position:relative;border-color:#ffd88a66}
.res .r.stam b small{font-size:9px;opacity:.75;font-weight:700}
.res .r.stam.low{border-color:#ff8a6a;animation:lowb 1.2s infinite}
@keyframes lowb{50%{background:#7a2a1acc}}
.chap{display:inline-block;margin-bottom:4px;background:linear-gradient(90deg,#7a4b12ee,#7a4b1200);color:#ffe9a8;font-size:11px;font-weight:900;padding:2px 14px 2px 8px;border-radius:8px 0 0 8px;text-shadow:0 1px 2px #000;cursor:pointer}
#sside{position:absolute;right:8px;top:192px;z-index:3;display:flex;flex-direction:column;gap:8px}

.sbtn{position:relative;width:52px;height:56px;border-radius:14px;border:2px solid #f6d77a;background:radial-gradient(circle at 50% 35%,#2a9b86,#0c4d44);color:#fff;font-weight:900;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 6px #0006,inset 0 1px 0 #ffffff55;cursor:pointer;padding:0}

.sbtn span:last-child{text-shadow:0 1px 2px #000}
.sbtn .dot{position:absolute;top:-4px;right:-4px}
#srest{position:absolute;left:56%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:3;text-align:center;color:#fff;background:#0a1f2ccc;border:2px solid #f6d77a;border-radius:18px;padding:8px 18px 10px;transition:.3s var(--ease);min-width:190px}

@keyframes zzz{50%{transform:translateY(-6px) rotate(-8deg)}}
.stambig{display:inline-flex;align-items:center;gap:6px;font-size:28px;font-weight:900}
.stambig .ic,.stambig svg{width:44px;height:44px}.stambig small{font-size:14px;opacity:.6}
.chapc{background:linear-gradient(135deg,#fff8e6,#f1ddb0);border:2px solid var(--gold2)}
.chlist{display:flex;gap:6px;margin-top:6px}.chlist span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;background:#d8cfb8;color:#6b5a3a}

.storyl{font-style:italic;color:#7a5a2a;margin:4px 0}
.glowc{box-shadow:0 0 0 2px var(--gold2),0 0 14px #ffd76a99}
.li.claimed{opacity:.6}
.actbar{position:relative;height:10px;border-radius:5px;background:#0002;margin:14px 14px 0}
.actbar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#3cc4a5,#ffd76a)}

    ['lv', 'don', 'shop'].forEach(k => { if (!s.guild[k] || typeof s.guild[k] !== 'object') s.guild[k] = {}; });
    if (!Array.isArray(s.guild.log)) s.guild.log = [];
    if (!Array.isArray(s.daily.got)) s.daily.got = [];
    CFG.heroes.forEach(h => { if (!s.heroes[h.id]) s.heroes[h.id] = { shards: 0, star: 0, bt: 0 }; });
    if (sch < 3) {   // v3：包子由貨幣改為體力 → 舊存量 ÷5 換算（至少 100、最多 300）【建議調整】
      s.migratedFrom = sch;
      s.res.bun = Math.min(300, Math.max(100, Math.round((s.res.bun || 0) / 5)));
      s.stam = { last: Date.now(), kc: 0, bought: 0, bday: s.day };
    }
    if (!s.stam || typeof s.stam !== 'object') s.stam = { last: Date.now(), kc: 0, bought: 0, bday: s.day };
    if (!s.ach || typeof s.ach !== 'object') s.ach = {};
    if (typeof s.pity !== 'number') s.pity = 0;
    if (!Array.isArray(s.team)) s.team = ['zhu'];
    { const seen = new Set(); s.team = s.team.filter(id => id && s.heroes[id] && s.heroes[id].star > 0 && !seen.has(id) && seen.add(id)); if (!s.team.length) s.team = ['zhu']; }   // v3.2 布陣：去重、移除未擁有
    if (!s.leader || !s.team.includes(s.leader)) s.leader = s.team[0] || 'zhu';   // v3.1 隊長
    if (typeof s.stats.donate !== 'number') s.stats.donate = 0;
    s.schema = 3;
    return s;
  },
  /* ---- v3.8 存檔校驗＋備份（單機防改檔，正式上線改伺服器驗證）----
   * 存檔字串內嵌 _sig（鹽＋雙 FNV-1a 雜湊）；已簽過的存檔若被手改 → 改讀上一份有效備份（_bak）。
   * 從未簽過的舊存檔（v3.7.1 以前）照常讀取，下次存檔起自動簽章。 */
  SALT: 'qf-青鋒-38',
  hash(str) { let a = 0x811c9dc5, b = 0x01000193 ^ 0x5bd1e995; const t = this.SALT + str; for (let i = 0; i < t.length; i++) { const c = t.charCodeAt(i); a = Math.imul(a ^ c, 16777619) >>> 0; b = Math.imul(b ^ c ^ (i & 255), 2246822519) >>> 0; } return a.toString(16).padStart(8, '0') + b.toString(16).padStart(8, '0'); },
  pack(o) { const c = Object.assign({}, o); delete c._sig; c.sigv = 1; const body = JSON.stringify(c); return body.slice(0, -1) + ',"_sig":"' + this.hash(body) + '"}'; },
  readSigned(key, isBak) {
    const raw = localStorage.getItem(key); if (!raw) return null;
    const d = JSON.parse(raw); if (!d || typeof d !== 'object') return null;
    if (d._sig) { const sig = d._sig; delete d._sig; const body = JSON.stringify(d); if (this.hash(body) === sig) return d; }
    else if (!d.sigv) return d;   // 未簽章的舊存檔
    console.warn('存檔校驗不符，改讀備份'); this.tampered = (this.tampered || 0) + 1;
    try { if (!isBak) localStorage.setItem(CFG.saveKey + '_bad', raw); } catch (e) { }
    return null;
  },
  save() {
    if (!S) return; S.lastSeen = now(); S.tMax = Math.max(S.tMax || 0, now());
    try { const prev = localStorage.getItem(CFG.saveKey); const str = this.pack(S); if (prev && prev !== str && /"_sig":"[0-9a-f]{16}"\}$/.test(prev)) localStorage.setItem(CFG.saveKey + '_bak', prev); localStorage.setItem(CFG.saveKey, str); } catch (e) { }
  },
  reset() { localStorage.removeItem(CFG.saveKey); localStorage.removeItem(CFG.saveKey + '_bak'); S = this.fresh(); this.save(); },
};

/* ------------------------- VipManager / 月卡 ------------------------- */
const VipManager = {
  level() { let l = 0; CFG.vip.forEach(v => { if (S.vip.total >= v.need) l = v.lv; }); return l; },
  sum(field) { const l = this.level(); return CFG.vip.filter(v => v.lv <= l && v[field]).reduce((a, v) => a + (typeof v[field] === 'number' ? v[field] : 1), 0); },
  max(field) { const l = this.level(); return CFG.vip.filter(v => v.lv <= l && v[field]).reduce((a, v) => Math.max(a, v[field]), 0); },
  has(field) { return this.sum(field) > 0; },
  hasCard() { return S.card.smallEnd > now(); },
  cardDaysLeft() { return Math.max(0, Math.ceil((S.card.smallEnd - now()) / 86400000)); },
  // v3.1：大月卡（至尊）／終身特權卡；三卡同時生效
  hasBig() { return (S.card.bigEnd || 0) > now(); },
  hasLife() { return !!S.card.life; },
  bigDaysLeft() { return Math.max(0, Math.ceil(((S.card.bigEnd || 0) - now()) / 86400000)); },
  activeCards() { return [this.hasCard() && CFG.smallCard, this.hasBig() && CFG.bigCard, this.hasLife() && CFG.lifeCard].filter(Boolean); },
  cardSum(f) { return this.activeCards().reduce((a, c) => a + (typeof c[f] === 'number' ? c[f] : 0), 0); },
  title() { return this.hasLife() ? CFG.lifeCard.title : ''; },
  frame() { return this.hasLife() ? CFG.lifeCard.frame : ''; },
  offlinePct() { return this.max('offline') + this.cardSum('offline') + KungfuManager.eff('idlePct') + GuildManager.eff('idle'); },
  fastBattle() { return this.has('fast') || this.activeCards().length > 0; },
  dropCap() { return CFG.baseDropCap + S.lv + this.max('cap') + this.cardSum('cap') + (S.dropRuneEnd > now() ? CFG.dropRune.bonus : 0); },
  qShift() { return (this.max('qShift') + this.cardSum('qShift')) * 4; },
  enhanceDisc() { return Math.max(this.has('enhanceDisc') ? 20 : 0, ...this.activeCards().map(c => c.enhanceDisc || 0)); },
  realmTimeMul() { return this.activeCards().reduce((m, c) => m * (1 - (c.realmTimePct || 0) / 100), 1); },
  // 模擬儲值：只改本地存檔，不連任何金流
  recharge(nt, silverToo = true) {
    const before = this.level();
    S.vip.total += nt;
    if (silverToo) {
      let sv = nt * 10; if (!S.vip.first[nt]) { sv *= 2; S.vip.first[nt] = true; }
      Eco.add({ silver: sv });
    }
    const after = this.level();
    if (after > before) UI.flash(`VIP ${after}！`);
    return after;
  },
  buyCard() {
    this.recharge(CFG.smallCard.price, false);
    S.card.smallEnd = Math.max(S.card.smallEnd, now()) + CFG.smallCard.days * 86400000;
    Eco.add(CFG.smallCard.instant);
    return CFG.smallCard.instant;
  },
  buyBig() {
    this.recharge(CFG.bigCard.price, false);
    S.card.bigEnd = Math.max(S.card.bigEnd || 0, now()) + CFG.bigCard.days * 86400000;
    Eco.add(CFG.bigCard.instant); return CFG.bigCard.instant;
  },
  buyLife() {
    if (this.hasLife()) return null;
    this.recharge(CFG.lifeCard.price, false);
    S.card.life = true; S.card.lifeAt = now();
    Eco.add(CFG.lifeCard.instant); return CFG.lifeCard.instant;
  },
  claimBigDaily() { if (!this.hasBig() || S.card.bigClaimDay === S.day) return null; S.card.bigClaimDay = S.day; const r = Object.assign({}, CFG.bigCard.daily, { silver: rint(CFG.bigCard.dailySilver[0], CFG.bigCard.dailySilver[1]) }); Eco.add(r); return r; },
  claimLifeDaily() { if (!this.hasLife() || S.card.lifeClaimDay === S.day) return null; S.card.lifeClaimDay = S.day; Eco.add(CFG.lifeCard.daily); return CFG.lifeCard.daily; },
  unclaimed() { return (this.hasCard() && S.card.claimDay !== S.day) || (this.hasBig() && S.card.bigClaimDay !== S.day) || (this.hasLife() && S.card.lifeClaimDay !== S.day); },
  claimCardDaily() {
    if (!this.hasCard() || S.card.claimDay === S.day) return null;
    S.card.claimDay = S.day; Eco.add(CFG.smallCard.daily); return CFG.smallCard.daily;
  },
};

/* ------------------------- EconomyManager ------------------------- */
const Eco = {
  has(cost) { return Object.entries(cost).every(([k, v]) => (S.res[k] || 0) >= v); },
  pay(cost) { if (!this.has(cost)) return false; Object.entries(cost).forEach(([k, v]) => S.res[k] -= v); return true; },
  add(r) {
    Object.entries(r).forEach(([k, v]) => {
      if (!v) return;
      if (k === 'exp') return PlayerManager.addExp(v);
      if (k === 'shardRand2') { const pool = CFG.heroes.filter(h => h.q === 2 && !h.limited); const h = pool[rint(0, pool.length - 1)]; S.heroes[h.id].shards += v; return; }
      if (k.startsWith('shard_')) { S.heroes[k.slice(6)].shards += v; return; }
      S.res[k] = (S.res[k] || 0) + v;
    });
  },
  costStr(cost) { return Object.entries(cost).map(([k, v]) => `<span class="${(S.res[k] || 0) >= v ? '' : 'redt'}">${CFG.currencies[k].icon}${fmt(v)}</span>`).join(' '); },
};

/* ------------------------- PlayerManager（屬性與戰力）------------------------- */
const PlayerManager = {
  addExp(v) {
    S.exp += Math.floor(v);
    let up = false;
    while (S.lv < CFG.player.maxLevel && S.exp >= CFG.player.expNeed(S.lv)) { S.exp -= CFG.player.expNeed(S.lv); S.lv++; up = true; }
    if (up) UI.flash(`江湖等級 ${S.lv}！`);
  },
  stats() {
    const b = CFG.player.base, p = CFG.player.perLevel;
    const s = { atk: b.atk + p.atk * (S.lv - 1), def: b.def + p.def * (S.lv - 1), hp: b.hp + p.hp * (S.lv - 1), crit: b.crit, extra: b.extra, reflect: b.reflect };
    Object.values(S.equip).forEach(it => { if (it) { const st = EquipManager.stats(it); for (const k in st) s[k] += st[k]; } });
    CFG.train.forEach(t => s[t.id] += t.per * (S.train[t.id] || 0));
    ['atk', 'def', 'hp', 'crit', 'extra', 'reflect'].forEach(k => s[k] += KungfuManager.eff(k));
    const ins = KungfuManager.insightPct();
    s.atk *= 1 + (KungfuManager.eff('atkPct') + ins) / 100;
    s.def *= 1 + (KungfuManager.eff('defPct') + ins) / 100;
    s.hp *= 1 + (KungfuManager.eff('hpPct') + ins) / 100;
    const gw = 1 + GuildManager.eff('war') / 100; s.atk *= gw; s.def *= gw; s.hp *= gw;   // v3 戰備營
    for (const k in s) s[k] = k === 'atk' || k === 'def' || k === 'hp' ? Math.round(s[k]) : Math.round(s[k] * 10) / 10;
    return s;
  },
  power() { return CFG.power(this.stats()) + S.team.reduce((a, id) => a + HeroManager.power(id), 0); },
};

/* ------------------------- EquipManager ------------------------- */
const EquipManager = {
  make(slot, q, lvl, s = S) {
    const it = { id: s.nextId++, slot, q, lvl: Math.max(1, lvl), enh: 0, af: [], isNew: true };
    const n = Math.max(0, q);            // 傳世起每階 +1 條副詞條
    for (let i = 0; i < n; i++) {
      const k = CFG.affixPool[rint(0, 2)];
      const hi = (s.vip && VipManagerSafe(s) >= 9) ? 1.3 : 1;     // VIP9 高稀有詞條提升
      it.af.push({ k, v: Math.round((1 + q * 0.8) * (1 + lvl * 0.02) * rnd(0.7, 1.2) * hi * 10) / 10 });
    }
    return it;
  },
  stats(it) {
    const sl = CFG.slots.find(x => x.id === it.slot);
    const m = (1 + it.lvl * CFG.itemLevelScale) * CFG.equipQualities[it.q].mult * (1 + it.enh * CFG.enhance.perLevel);
    const s = {};
    for (const k in sl.stat) s[k] = k === 'crit' ? Math.round(sl.stat[k] * (1 + it.q * 0.5) * 10) / 10 : Math.round(sl.stat[k] * m);
    it.af.forEach(a => s[a.k] = Math.round(((s[a.k] || 0) + a.v) * 10) / 10);
    return s;
  },
  score(it) { if (!it) return 0; const s = Object.assign({ atk: 0, def: 0, hp: 0, crit: 0, extra: 0, reflect: 0 }, this.stats(it)); return CFG.power(s); },
  better(it) { return this.score(it) > this.score(S.equip[it.slot]); },
  rollQuality(dist) {
    const tot = dist.reduce((a, b) => a + b, 0); let r = Math.random() * tot;
    for (let i = 0; i < dist.length; i++) { r -= dist[i]; if (r < 0) return i; }
    return 0;
  },
  shift(dist, pts) {  // 品質分布整體上移 pts 個百分點
    const d = dist.slice();
    for (let i = 0; i < d.length - 1 && pts > 0; i++) { const mv = Math.min(d[i], pts); d[i] -= mv; d[i + 1] += mv; if (d[i] > 0) break; }
    return d;
  },
  realmDist(extraShift = 0) {
    const idx = clamp(S.realm.lv - 1 + extraShift, 0, CFG.realm.length - 1);
    return this.shift(CFG.realm[idx].dist, VipManager.qShift());
  },
  dropLevel(src) { return clamp(src, 1, VipManager.dropCap()); },
  // 產生掉落並放入倉庫
  drop(q, srcLevel) {
    const sl = CFG.slots[rint(0, CFG.slots.length - 1)].id;
    const it = this.make(sl, q, this.dropLevel(Math.round(srcLevel * rnd(0.85, 1))));
    if (S.bag.length >= bagCap()) { const sv = CFG.salvage(q); Eco.add(sv); return null; }   // 背包滿自動分解
    S.bag.push(it); return it;
  },
  openBox(key, n = 1) {
    const b = CFG.boxes[key]; const got = [];
    for (let i = 0; i < n && S.res[key] > 0; i++) {
      S.res[key]--;
      let q = this.rollQuality(this.realmDist(b.shift)); q = Math.max(q, b.minQ);
      const it = this.drop(q, this.idleItemLevel() + 3); if (it) got.push(it);
    }
    return got;
  },
  idleItemLevel() { return S.lv + Math.floor(S.tower.floor / 2); },
  equip(id) {
    const i = S.bag.findIndex(x => x.id === id); if (i < 0) return;
    const it = S.bag.splice(i, 1)[0]; it.isNew = false;
    const old = S.equip[it.slot]; if (old) S.bag.push(old);
    S.equip[it.slot] = it;
  },
  autoEquip() {
    let n = 0;
    CFG.slots.forEach(sl => {
      const best = S.bag.filter(x => x.slot === sl.id).sort((a, b) => this.score(b) - this.score(a))[0];
      if (best && this.better(best)) { this.equip(best.id); n++; }
    });
    return n;
  },
  salvage(id) {
    const i = S.bag.findIndex(x => x.id === id); if (i < 0) return null;
    const it = S.bag.splice(i, 1)[0]; const r = CFG.salvage(it.q);
    // 【建議調整 v3.8】強化返還＝實際花費的 50%（原固定每級 300 銅＋2 精鐵，低級強化後分解有淨賺）
    for (let k = 0; k < (it.enh || 0); k++) { const c = CFG.enhance.cost(k); r.copper += Math.floor(c.copper * 0.5); r.iron += Math.floor(c.iron * 0.5); }
    Eco.add(r); return r;
  },
  salvageWorse() {
    const tot = { copper: 0, iron: 0 }; let n = 0;
    S.bag.filter(it => !this.better(it)).forEach(it => { const r = this.salvage(it.id); tot.copper += r.copper; tot.iron += r.iron; n++; });
    return { n, tot };
  },
  enhCost(it) {
    const c = CFG.enhance.cost(it.enh); const d = 1 - VipManager.enhanceDisc() / 100;   // VIP7 裝備重鑄折扣（此原型套在強化）
    return { copper: Math.floor(c.copper * d), iron: c.iron };
  },
  enhance(it) {
    if (it.enh >= CFG.enhance.maxByQuality[it.q]) return false;
    if (!Eco.pay(this.enhCost(it))) return false;
    it.enh++; return true;
  },
};
function VipManagerSafe(s) { let l = 0; CFG.vip.forEach(v => { if (s.vip && s.vip.total >= v.need) l = v.lv; }); return l; }

/* ------------------------- RealmManager（裝備境界）------------------------- */
const RealmManager = {
  max() { return CFG.realm.length; },
  next() { return CFG.realm[S.realm.lv]; },
  timeMul() { return VipManager.realmTimeMul(); },
  upgrading() { return S.realm.upEnd > 0; },
  remain() { return Math.max(0, (S.realm.upEnd - now()) / 1000); },
  start() {
    if (this.upgrading() || S.realm.lv >= this.max()) return false;
    const n = this.next(); if (!Eco.pay({ copper: n.copper })) return false;
    S.realm.upEnd = now() + n.sec * 1000 * this.timeMul(); return true;
  },
  speedUp(all) {
    if (!this.upgrading()) return 0;
    const need = Math.ceil(this.remain() / CFG.speedRuneSec);
    const use = all ? Math.min(need, S.res.speed) : Math.min(1, S.res.speed);
    if (use <= 0) return 0;
    S.res.speed -= use; S.realm.upEnd -= use * CFG.speedRuneSec * 1000; this.tick(); return use;
  },
  tick() {
    if (this.upgrading() && now() >= S.realm.upEnd) { S.realm.upEnd = 0; S.realm.lv++; UI.flash(`裝備境界 Lv${S.realm.lv}！`); UI.toast('掉落品質分布上移了'); return true; }
    return false;
  },
};

/* ------------------------- HeroManager ------------------------- */
function heroDef(id) { return CFG.heroes.find(h => h.id === id); }
const HeroManager = {
  owned(id) { return !!(S.heroes[id] && S.heroes[id].star > 0); },
  stats(id) {
    const d = heroDef(id), h = S.heroes[id];
    const m = (1 + 0.3 * Math.max(0, h.star - 1)) * (1 + CFG.breakthrough.slice(0, h.bt).reduce((a, b) => a + b.bonus, 0)) * (1 + 0.06 * (S.lv - 1));
    return { atk: Math.round(d.atk * m), def: Math.round(d.def * m), hp: Math.round(d.hp * m), crit: 0, extra: 0, reflect: 0 };
  },
  power(id) { return this.owned(id) ? CFG.power(this.stats(id)) : 0; },
  starCost(id) { const h = S.heroes[id]; if (h.star >= CFG.heroMaxStar) return null; return CFG.starShards[h.star][heroDef(id).q]; },
  starUp(id) {
    const c = this.starCost(id); if (c == null || S.heroes[id].shards < c) return false;
    S.heroes[id].shards -= c; S.heroes[id].star++;
    if (S.heroes[id].star === 1 && !S.team.includes(id) && S.team.length < this.slots()) { S.team.push(id); this.autoJoined = id; }   // 新召喚自動上陣（少一步操作）
    return true;
  },
  btCost(id) { const h = S.heroes[id]; const b = CFG.breakthrough[h.bt]; if (!b) return null; return { needStar: b.needStar, stone: b.stone[heroDef(id).q] }; },
  breakthrough(id) {
    const c = this.btCost(id); if (!c || S.heroes[id].star < c.needStar) return false;
    if (!Eco.pay({ stone: c.stone })) return false; S.heroes[id].bt++; return true;
  },
  /** v3.1 隊長：舞台上唯一行走／戰鬥的俠客（必須在隊伍中；無效時退回第一位） */
  leader() { const l = S.leader; return (l && S.team.includes(l) && this.owned(l)) ? l : (S.team.find(id => this.owned(id)) || S.team[0] || 'zhu'); },
  assists() { const l = this.leader(); return S.team.filter(id => id !== l && this.owned(id)); },
  setLeader(id) {
    if (!this.owned(id)) return 'locked';
    if (!S.team.includes(id)) { if (S.team.length >= this.slots()) return 'full'; S.team.push(id); }
    S.leader = id; return 'ok';
  },
  /* ---- v3.2 布陣：上陣格數依進度解鎖、指定位置上/下陣、互換、一鍵最強 ---- */
  slotOpen(i) { const d = (CFG.teamSlotDefs || [])[i]; if (!d) return false; return (!d.floor || S.tower.floor >= d.floor) && (!d.lv || S.lv >= d.lv); },
  slots() { let n = 0; for (let i = 0; i < (CFG.teamSlotDefs || []).length; i++) if (this.slotOpen(i)) n = i + 1; else break; return Math.max(1, n || CFG.teamSlots); },
  normTeam() { const seen = new Set(); S.team = S.team.filter(id => id && this.owned(id) && !seen.has(id) && seen.add(id)).slice(0, this.slots()); if (!S.team.length) { const o = CFG.heroes.find(h => this.owned(h.id)); S.team = [o ? o.id : 'zhu']; } if (!S.team.includes(S.leader)) S.leader = S.team[0]; },
  removeAt(i) { if (!S.team[i]) return 'empty'; if (S.team.length <= 1) return 'need1'; const id = S.team.splice(i, 1)[0]; if (S.leader === id) S.leader = S.team[0]; return 'off'; },
  placeAt(id, i) {   // 把 id 放到第 i 格：空格→上陣；有人→替換（若 id 已在隊中則兩人互換位置）
    if (!this.owned(id)) return 'locked'; if (i >= this.slots()) return 'slotlocked';
    const j = S.team.indexOf(id), cur = S.team[i];
    if (j >= 0) { if (cur) { S.team[i] = id; S.team[j] = cur; } return 'swap'; }
    if (cur) { S.team[i] = id; if (S.leader === cur) S.leader = id; return 'replace'; }
    if (S.team.length >= this.slots()) return 'full'; S.team.push(id); return 'on';
  },
  swapSlots(i, j) { const t = S.team; if (!t[i] || !t[j]) return false; [t[i], t[j]] = [t[j], t[i]]; return true; },
  autoBest() { const own = CFG.heroes.map(h => h.id).filter(id => this.owned(id)).sort((a, b) => this.power(b) - this.power(a)); const keep = this.leader(); S.team = own.slice(0, this.slots()); if (S.team.includes(keep)) S.leader = keep; else S.leader = S.team[0]; return S.team.length; },
  toggleTeam(id) {
    const i = S.team.indexOf(id);
    if (i >= 0) { if (S.team.length <= 1) return 'need1'; S.team.splice(i, 1); if (S.leader === id) S.leader = S.team[0]; return 'off'; }
    if (!this.owned(id)) return 'locked';
    if (S.team.length >= this.slots()) return 'full';
    S.team.push(id); return 'on';
  },
  recruit(n) {
    if (S.res.tie < n) return null;
    S.res.tie -= n; S.stats.recruit += n;
    const res = []; let gotHigh = false;
    for (let i = 0; i < n; i++) {
      let q;
      if (S.stats.recruit === n && i === 0) q = 1;           // 首抽必得精良（秦墨 / 沈青禾）碎片，可直接召喚
      else q = EquipManager.rollQuality(CFG.recruit.rates);
      if (n >= 10 && i === n - 1 && !gotHigh) q = Math.max(q, CFG.recruit.tenPullGuarantee);
      if (q >= 2) gotHigh = true;
      const pool = CFG.heroes.filter(h => h.q === q && !h.limited); const h = pool[rint(0, pool.length - 1)];
      let cnt = rint(...CFG.recruit.shards[q]);
      if (S.stats.recruit === n && i === 0) cnt = CFG.starShards[0][1];
      S.heroes[h.id].shards += cnt; res.push({ id: h.id, cnt, q });
    }
    return res;
  },
  canAct(id) { const c = this.starCost(id); return c != null && S.heroes[id].shards >= c; },
};

/* ------------------------- KungfuManager（功法）------------------------- */
const KungfuManager = {
  opt(id) { for (const s of CFG.kungfuSlots) for (const o of s.opts) if (o.id === id) return { slot: s, o }; return null; },
  lv(id) { return S.kungfu.lv[id] || 0; },
  eff(k) {
    let v = 0;
    Object.values(S.kungfu.eq).forEach(id => { const f = this.opt(id); if (f && typeof f.o.eff[k] === 'number') v += f.o.eff[k] * this.lv(id); });
    return v;
  },
  ult() { const id = S.kungfu.eq.ult; if (!id) return null; const f = this.opt(id); return { type: f.o.eff.ult, mult: 1 + f.o.eff.ultPct * this.lv(id) / 100, name: f.o.name }; },
  totalLv() { return Object.values(S.kungfu.lv).reduce((a, b) => a + b, 0); },
  insightPct() { let p = 0; CFG.insight.forEach(i => { if (this.totalLv() >= i.total) p = i.pct; }); return p; },
  equip(slotId, optId) { if (this.lv(optId) <= 0) S.kungfu.lv[optId] = 1; S.kungfu.eq[slotId] = optId; },
  cost(optId) { return CFG.kungfuCost(Math.max(1, this.lv(optId))); },
  up(optId) { if (this.lv(optId) >= CFG.kungfuMax) return false; if (this.lv(optId) === 0) { S.kungfu.lv[optId] = 1; return true; } if (!Eco.pay(this.cost(optId))) return false; S.kungfu.lv[optId]++; return true; },
};

/* ------------------------- IdleManager（掛機 / 離線 / 挖礦）------------------------- */
const IdleManager = {
  capH() { return CFG.idle.baseCapHours + VipManager.sum('idleH'); },
  mult() { return 1 + VipManager.offlinePct() / 100; },
  minutes() { return clamp((now() - S.idle.last) / 60000, 0, this.capH() * 60); },   // v3.8：時間倒退時不出現負數（也不把起點拉回現在，避免「先調快領取再調回」重複領）
  preview(min = this.minutes()) {
    const f = S.tower.floor, m = this.mult(), I = CFG.idle;
    return { copper: Math.floor(I.copper(f) * min * m), exp: Math.floor(I.exp(f) * min * m), iron: Math.floor(I.iron(f) * min * m), page: Math.floor(I.page(f) * min * m), equips: Math.floor(min / I.equipEveryMin) };
  },
  grant(p) {
    const r = { copper: p.copper, exp: p.exp, iron: p.iron, page: p.page };
    Eco.add(r);
    const items = [];
    for (let i = 0; i < Math.min(p.equips, 30); i++) { const it = EquipManager.drop(EquipManager.rollQuality(EquipManager.realmDist()), EquipManager.idleItemLevel()); if (it) items.push(it); }
    return { r, items };
  },
  claim() { const p = this.preview(); S.idle.last = Math.max(S.idle.last || 0, now()); S.stats.idle++; return this.grant(p); },
  // 掃蕩 = 立即獲得 N 小時掛機收益
  sweepFree() { return CFG.inn.baseFree + VipManager.sum('sweep') + VipManager.cardSum('sweep'); },
  sweep() {
    const free = this.sweepFree();
    if (S.inn.used >= free) {
      const c = CFG.inn.extraCost[Math.min(S.inn.extra, CFG.inn.extraCost.length - 1)];
      if (!Eco.pay({ bun: c })) return null; S.inn.extra++;
    } else S.inn.used++;
    S.stats.sweep++;
    return this.grant(this.preview(CFG.inn.sweepHours * 60));
  },
  mineRate(id) { const m = CFG.mines.find(x => x.id === id); return (m.base + m.per * (S.mines[id].lv - 1)) * (1 + KungfuManager.eff('idlePct') / 100); },
  mineUnlocked(id) { return S.lv >= CFG.mines.find(x => x.id === id).unlock; },
  mineAmount(id) { if (!this.mineUnlocked(id)) return 0; const min = clamp((now() - S.mines[id].last) / 60000, 0, CFG.mineCapHours * 60); return this.mineRate(id) * min; },
  mineCollect(id) {
    const m = CFG.mines.find(x => x.id === id); const a = Math.floor(this.mineAmount(id)); if (a <= 0) return 0;
    Eco.add({ [m.res]: a }); S.mines[id].last = Math.max(S.mines[id].last || 0, now()); return a;
  },
  mineCollectAll() { const t = {}; CFG.mines.forEach(m => { const a = this.mineCollect(m.id); if (a) t[m.res] = (t[m.res] || 0) + a; }); return t; },
  mineUp(id) { this.mineCollect(id); if (!Eco.pay({ copper: CFG.mineUpCost(S.mines[id].lv) })) return false; S.mines[id].lv++; S.mines[id].last = now(); return true; },
};

/* ------------------------- TowerManager（試煉之塔）------------------------- */
const TowerManager = {
  next() { return S.tower.floor + 1; },
  req(f = this.next()) { return CFG.tower.reqPower(f); },
  win() { const f = this.next(); const r = CFG.tower.reward(f); S.tower.floor = f; Eco.add(r); return r; },
};

/* ------------------------- 每日重置 ------------------------- */
function dailyReset() {
  const d = dayKey(), i = dayIdx();
  if (typeof S.dayMax !== 'number') { const k = dayIdxOfKey(S.day); S.dayMax = k == null ? i - 1 : k; }   // 舊存檔遷移
  if (i <= S.dayMax) return false;   // 同一天、或系統時間被調回過去 → 不重置
  S.dayMax = i; S.day = d; S.gifts = []; S.shop = {}; S.inn.used = 0; S.inn.extra = 0;
  S.trial.used = 0; S.trial.ticketAtt = 0; S.trial.ticketBought = 0;
  if (S.guild) { S.guild.don = {}; S.guild.packets = 0; S.guild.shop = {}; }   // v3 幫會每日
  return true;
}

/* ------------------------- 每日饋贈 ------------------------- */
const GiftManager = {
  state(i) { return S.gifts[i] || ''; },   // '' | 'claimed' | 'skipped'
  available(i) { for (let j = 0; j < i; j++) if (!this.state(j)) return false; return !this.state(i); },
  claim(i, simulatedPay) {
    const g = CFG.dailyGifts[i]; if (!this.available(i)) return null;
    if (g.paid && !simulatedPay) { S.gifts[i] = 'skipped'; return {}; }
    if (g.paid) VipManager.recharge(g.paid, false);
    S.gifts[i] = 'claimed'; Eco.add(g.items); return g.items;
  },
};

/* ------------------------- GoalManager（目標導引）------------------------- */
const GoalManager = {
  checks: {
    g_idle: () => S.stats.idle > 0,
    g_equip: () => !!S.equip.weapon,
    g_recruit: () => S.stats.recruit > 0,
    g_team: () => S.team.length >= 2,
    g_tower1: () => S.tower.floor >= 1,
    g_enh: () => S.equip.weapon && S.equip.weapon.enh >= 3,
    g_trial1: () => S.trial.maxCleared >= 1,
    g_gift: () => S.gifts.some(x => x === 'claimed'),
    g_train: () => S.stats.train >= 5,
    g_realm: () => S.realm.lv >= 2,
    g_ult: () => !!S.kungfu.eq.ult,
    g_mine: () => S.mines.cu.lv >= 2,
    g_tower5: () => S.tower.floor >= 5,
    g_star: () => Object.values(S.heroes).some(h => h.star >= 2),
    g_trial3: () => S.trial.maxCleared >= 3,
    g_inn: () => S.stats.sweep > 0,
  },
  current() {
    if (S.goal.idx < CFG.goals.length) return CFG.goals[S.goal.idx];
    if (!S.goal.cur) this.genNext();
    return S.goal.cur;
  },
  genNext() {
    const k = S.goal.gen++ % 3;
    let g;
    if (k === 0) { const t = (Math.floor(S.tower.floor / 5) + 1) * 5; g = { kind: 'tower', target: t, text: `試煉之塔達到第 ${t} 層`, hint: '自動連戰 + 養成', go: 'tower', reward: { stone: 2 + Math.floor(t / 10), tie: 3, bun: 20 } }; }
    else if (k === 1) { const t = Math.min(CFG.trial.maxLayer, S.trial.maxCleared + 2); g = { kind: 'trial', target: t, text: `通關魂器試煉第 ${t} 層`, hint: '江湖 → 魂器試煉', go: 'trial', reward: { essence: 60 + t * 5, bun: 30 } }; }
    else { const t = S.lv + 3; g = { kind: 'lv', target: t, text: `江湖等級達到 ${t}`, hint: '掛機、闖塔、試煉都給經驗', go: 'home', reward: { tie: 5, speed: 2 } }; }
    S.goal.cur = g;
  },
  done() {
    const g = this.current();
    if (S.goal.idx < CFG.goals.length) return this.checks[g.id]();
    if (g.kind === 'tower') return S.tower.floor >= g.target;
    if (g.kind === 'trial') return S.trial.maxCleared >= g.target;
    return S.lv >= g.target;
  },
  claim() {
    if (!this.done()) return null;
    const g = this.current(); Eco.add(g.reward);
    if (S.goal.idx < CFG.goals.length) S.goal.idx++; else { S.goal.cur = null; }
    return g.reward;
  },
};

/* ============================================================
 * v3 管理器：音效 / 幫會 / 七日簽到 / 每日任務
 * （Unity 對照：各為一個 Manager MonoBehaviour；CFG.* 為 ScriptableObject）
 * ============================================================ */
function bagCap() { return CFG.bagCap + Math.round(GuildManager.eff('bag')); }

/* ------------------------- AudioManager：WebAudio 即時合成音效（無外部音檔） ------------------------- */
const AudioManager = {
  ctx: null, master: null, last: {}, nbuf: null,
  muted() { return !!(typeof S !== 'undefined' && S && S.opt && S.opt.mute); },
  ensure() {
    if (this.muted()) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      try { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.32; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; return null; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(f0, f1, dur, type = 'sine', vol = 0.3, delay = 0) {
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.3, fc = 1800, delay = 0, q = 1.2) {
    const c = this.ctx;
    if (!this.nbuf) { const n = c.sampleRate * 0.6, b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; this.nbuf = b; }
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nbuf; f.type = 'bandpass'; f.frequency.value = fc; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.02);
  },
  arp(notes, step = 0.07, type = 'triangle', vol = 0.22, dur = 0.16) { notes.forEach((f, i) => this.tone(f, f, dur, type, vol, i * step)); },
  play(k) {
    const c = this.ensure(); if (!c) return;
    const t = performance.now(), thr = { hit: 55, coin: 70, kill: 45, click: 40 }[k] || 30;
    if (this.last[k] && t - this.last[k] < thr) return; this.last[k] = t;
    try {
      switch (k) {
        case 'hit': this.noise(0.06, 0.28, 2600); this.tone(300, 120, 0.07, 'square', 0.07); break;
        case 'crit': this.noise(0.12, 0.42, 3400); this.tone(980, 320, 0.13, 'sawtooth', 0.12); break;
        case 'kill': this.tone(520, 980, 0.07, 'triangle', 0.16); break;
        case 'elite': this.noise(0.3, 0.5, 700); this.tone(150, 55, 0.35, 'sawtooth', 0.22); break;
        case 'jump': this.tone(280, 720, 0.12, 'sine', 0.2); break;
        case 'dash': this.noise(0.16, 0.32, 1400, 0, 0.7); this.tone(500, 200, 0.12, 'sine', 0.08); break;
        case 'hurt': this.tone(210, 80, 0.14, 'square', 0.14); break;
        case 'skill': this.noise(0.35, 0.35, 1100, 0, 0.6); this.tone(220, 880, 0.22, 'sawtooth', 0.14); this.tone(660, 1320, 0.25, 'triangle', 0.16, 0.08); break;
        case 'portal': this.tone(200, 1200, 0.5, 'sine', 0.18); this.arp([784, 988, 1175], 0.09, 'triangle', 0.12); break;
        case 'coin': this.tone(1320, 1320, 0.05, 'square', 0.07); this.tone(1760, 1760, 0.09, 'square', 0.07, 0.05); break;
        case 'click': this.tone(760, 520, 0.045, 'triangle', 0.12); break;
        case 'reward': this.arp([523, 659, 784, 1047], 0.075, 'triangle', 0.18, 0.2); break;
        case 'win': this.arp([392, 523, 659, 784, 1047], 0.09, 'triangle', 0.2, 0.25); this.noise(0.4, 0.15, 5000, 0.3); break;
        case 'fail': this.arp([392, 330, 262, 196], 0.12, 'sine', 0.18, 0.25); break;
        case 'build': this.noise(0.08, 0.3, 900); this.noise(0.08, 0.3, 900, 0.14); this.arp([523, 784], 0.12, 'triangle', 0.16, 0.2); break;
      }
    } catch (e) { }
  },
  toggle() { S.opt.mute = !S.opt.mute; if (!S.opt.mute) this.play('click'); else if (this.ctx) this.ctx.suspend().catch(() => {}); return !S.opt.mute; },
};

/* ------------------------- GuildManager：單機模擬幫會（NPC 成員每日捐資） ------------------------- */
const GuildManager = {
  B(id) { return CFG.guild.buildings.find(b => b.id === id); },
  lv(id) { return (S && S.guild && S.guild.lv && S.guild.lv[id]) || 1; },
  unlocked() { return S.lv >= CFG.guild.unlockLv; },
  joined() { return !!(S && S.guild && S.guild.joined); },
  val(id, f) { return this.B(id).eff[f][this.lv(id) - 1]; },
  join() {
    if (!this.unlocked() || this.joined()) return false;
    const g = S.guild; g.joined = true; g.fund = CFG.guild.seedFund; g.last = now(); g.joinT = now();
    this.log(`你加入了「${CFG.guild.name}」，幫主撥出 ${fmt(CFG.guild.seedFund)} 資金歡迎新人`); return true;
  },
  log(t) { const g = S.guild; g.log.unshift({ t: now(), s: t }); if (g.log.length > 20) g.log.length = 20; },
  members() { return this.val('hall', 'members'); },
  dailyFund() { return Math.round((this.members() - 1) * CFG.guild.perMember * CFG.guild.activeRate); },
  eff(k) {
    if (!this.joined()) return 0;
    switch (k) {
      case 'war': return this.val('war', 'pct') * 0.5;
      case 'idle': return this.val('train', 'pct');
      case 'soulPct': return this.val('soul', 'pct');
      case 'soulExtra': return this.val('soul', 'extra');
      case 'bag': return (this.val('ware', 'cap') - 50) / 5;
      case 'gcPct': return this.val('contrib', 'gcPct');
      case 'donTimes': return this.val('contrib', 'times');
      case 'packets': return this.val('notice', 'packets');
      case 'shopItems': return this.val('shopb', 'items');
      case 'shopTier': return this.val('shopb', 'tier');
    }
    return 0;
  },
  /** 單一效果的文字（建築詳情用） */
  effStr(id, l) {
    const b = this.B(id), e = b.eff, i = l - 1; if (i < 0 || i > 9) return '';
    return {
      hall: () => `成員上限 ${e.members[i]} · 每日資金約 ${fmt(Math.round((e.members[i] - 1) * CFG.guild.perMember * CFG.guild.activeRate))} · 建築上限 Lv${l}`,
      contrib: () => `捐獻幫貢 +${e.gcPct[i]}% · 每日捐獻 ${e.times[i]} 次（每種）`,
      war: () => `幫會戰屬性 +${e.pct[i]}%（現套用 +${e.pct[i] * 0.5}%）· 復活 ${e.revive[i]} 次`,
      shopb: () => `商品 ${e.items[i]} 種 · 最高品質 ${['', '一階', '二階', '三階', '四階'][e.tier[i]]}`,
      train: () => `掛機／離線收益 +${e.pct[i]}%`,
      soul: () => `試煉精華 +${e.pct[i]}% · 每日試煉 +${e.extra[i]} 次`,
      ware: () => `倉庫容量 ${e.cap[i]}（背包 +${(e.cap[i] - 50) / 5} 格）`,
      notice: () => `每日紅包 ${e.packets[i]} 個 · 榮譽欄 ${e.honor[i]}`,
    }[id]();
  },
  cost(id) { const b = this.B(id), l = this.lv(id); return l >= 10 ? null : { fund: b.fund[l - 1], sec: Math.round(b.hours[l - 1] * 3600) }; },
  /** 不能升級的原因：null = 可以 */
  why(id) {
    const b = this.B(id), l = this.lv(id), hall = this.lv('hall'), g = S.guild;
    if (l >= 10) return '已滿級';
    if (hall < b.unlock) return `大廳 Lv${b.unlock} 解鎖`;
    if (id !== 'hall' && l >= hall) return `需先把大廳升到 Lv${l + 1}`;
    if (g.build) return g.build.id === id ? '升級中' : `「${this.B(g.build.id).name}」施工中（同時僅能一棟）`;
    if (g.fund < this.cost(id).fund) return `資金不足（${fmt(g.fund)}/${fmt(this.cost(id).fund)}）`;
    return null;
  },
  up(id) {
    if (this.why(id)) return false;
    const c = this.cost(id), g = S.guild; g.fund -= c.fund; g.build = { id, start: now(), end: now() + c.sec * 1000, total: c.sec * 1000 };
    this.log(`開始升級「${this.B(id).name}」→ Lv${this.lv(id) + 1}，耗資 ${fmt(c.fund)}`); return true;
  },
  left() { const b = S.guild && S.guild.build; return b ? Math.max(0, b.end - now()) : 0; },
  /** 每秒呼叫：NPC 捐資 + 完工 */
  tick() {
    if (!this.joined()) return false;
    const g = S.guild, t = now(); let done = false;
    const dt = clamp((t - (g.last || t)) / 1000, 0, CFG.guild.offlineCapH * 3600);
    if (dt > 0) { g.fundAcc = (g.fundAcc || 0) + dt * this.dailyFund() / 86400; const add = Math.floor(g.fundAcc); if (add > 0) { g.fund += add; g.fundAcc -= add; g.npcTotal = (g.npcTotal || 0) + add; } }
    g.last = t;
    if (g.build && g.build.end <= t) { const id = g.build.id; g.lv[id] = this.lv(id) + 1; g.build = null; this.log(`「${this.B(id).name}」升到 Lv${g.lv[id]}！`); done = id; AudioManager.play('build'); }
    return done;
  },
  speedUp(all) {
    const g = S.guild; if (!g.build) return 0; let n = 0;
    while (S.res.speed > 0 && this.left() > 0) { S.res.speed--; g.build.end -= CFG.guild.speedSec * 1000; n++; if (!all) break; }
    this.tick(); return n;
  },
  silverCost() { return Math.ceil(this.left() / 3600000) * 20; },   // 銀錠立即完工：每剩 1 小時 20 銀錠【建議調整】
  finishSilver() { const c = this.silverCost(); if (!S.guild.build || !Eco.pay({ silver: c })) return false; S.guild.build.end = now(); this.tick(); return true; },
  donLeft(type) { return Math.max(0, this.eff('donTimes') - ((S.guild.don || {})[type] || 0)); },
  donate(type) {
    const d = CFG.guild.donate[type]; if (!this.joined()) return null;
    if (this.donLeft(type) <= 0) return 'times';
    if (!Eco.pay(d.cost)) return 'res';
    const g = S.guild; g.don[type] = (g.don[type] || 0) + 1; g.fund += d.fund; g.my = (g.my || 0) + d.fund;
    const gc = Math.round(d.gc * (1 + this.eff('gcPct') / 100)); Eco.add({ gc });
    this.log(`你進行了${d.name}：幫會資金 +${fmt(d.fund)}`); DailyManager.bump('donate'); S.stats.donate = (S.stats.donate || 0) + 1;
    return { gc, fund: d.fund };
  },
  packetLeft() { return Math.max(0, this.eff('packets') - (S.guild.packets || 0)); },
  packet() {
    if (this.packetLeft() <= 0) return null; S.guild.packets = (S.guild.packets || 0) + 1;
    const P = CFG.guild.packet, ks = Object.keys(P), k = ks[rint(0, ks.length - 1)], r = { [k]: rint(P[k][0], P[k][1]) };
    Eco.add(r); return r;
  },
  shopList() { const n = this.eff('shopItems'), tier = this.eff('shopTier'); return CFG.guild.shop.slice(0, n).map(it => Object.assign({ locked: it.tier > tier }, it)); },
  buy(id) {
    const it = this.shopList().find(x => x.id === id); if (!it || it.locked) return 'locked';
    const n = S.guild.shop[id] || 0; if (n >= it.daily) return 'limit';
    if (!Eco.pay({ gc: it.cost })) return 'res';
    S.guild.shop[id] = n + 1; Eco.add(it.give); return it.give;
  },
  /** 是否有可做的事（紅點） */
  todo() {
    if (!this.unlocked()) return false; if (!this.joined()) return true;
    return this.donLeft('copper') > 0 && S.res.copper >= CFG.guild.donate.copper.cost.copper || this.packetLeft() > 0 || CFG.guild.buildings.some(b => !this.why(b.id));
  },
};

/* ------------------------- SignManager：七日簽到 ------------------------- */
const SignManager = {
  can() { return S.sign.last !== S.day; },
  idx() { return S.sign.n % 7; },
  reward(i) { const r = Object.assign({}, CFG.sign[i]); if (VipManager.hasCard()) for (const k in r) r[k] *= CFG.signCardMult; return r; },
  claim() { if (!this.can()) return null; const r = this.reward(this.idx()); S.sign.n++; S.sign.last = S.day; Eco.add(r); return r; },
};

/* ------------------------- DailyManager：每日任務 + 活躍度 ------------------------- */
const DailyManager = {
  ensure() { const d = S.daily; if (!d || d.day !== S.day) S.daily = { day: S.day, c: {}, k0: S.stats.kills, got: [] }; return S.daily; },
  bump(id, n = 1) { const d = this.ensure(); d.c[id] = (d.c[id] || 0) + n; },
  prog(t) { const d = this.ensure(); const v = t.id === 'kills' ? S.stats.kills - d.k0 : (d.c[t.id] || 0); return Math.min(t.need, Math.max(0, v)); },
  done(t) { return this.prog(t) >= t.need; },
  pts() { return CFG.daily.tasks.reduce((a, t) => a + (this.done(t) ? t.pts : 0), 0); },
  canClaim(i) { const c = CFG.daily.chests[i]; return this.pts() >= c.pts && !this.ensure().got.includes(i); },
  claim(i) { if (!this.canClaim(i)) return null; this.ensure().got.push(i); const r = CFG.daily.chests[i].r; Eco.add(r); return r; },
  anyClaim() { return CFG.daily.chests.some((c, i) => this.canClaim(i)); },
};

/* ============================================================
 * v3d：StaminaManager（包子＝體力）
 *  - 俠客居橫版推進：每斬 CFG.stamina.killsPerBun 隻妖物消耗 1 個包子
 *  - 包子歸零 → 隊伍原地休息（HS.state='rest'），每 5 分鐘自然回復 1 個（上限 100，離線也回復）
 *  - 來源：自然回復、每日饋贈、任務、成就、簽到、幫會紅包、模擬購買、試煉獎勵
 * ============================================================ */
const StaminaManager = {
  cfg() { return CFG.stamina; },
  st() { if (!S.stam || typeof S.stam !== 'object') S.stam = { last: now(), kc: 0, bought: 0, bday: S.day }; return S.stam; },
  cur() { return S.res.bun; },
  cap() { return this.cfg().cap; },
  tick() {
    const st = this.st(), c = this.cfg(), t = now();
    if (S.res.bun >= c.cap) { st.last = t; return 0; }
    const n = Math.floor((t - st.last) / 1000 / c.regenSec);
    if (n > 0) { const add = Math.min(n, c.cap - S.res.bun); S.res.bun += add; st.last += n * c.regenSec * 1000; if (S.res.bun >= c.cap) st.last = t; return add; }
    return 0;
  },
  nextIn() { if (S.res.bun >= this.cap()) return 0; const st = this.st(); return Math.max(0, this.cfg().regenSec - (now() - st.last) / 1000); },
  fullIn() { if (S.res.bun >= this.cap()) return 0; return this.nextIn() + (this.cap() - S.res.bun - 1) * this.cfg().regenSec; },
  // 每斬 1 隻妖物呼叫；回傳是否扣了包子
  onKill() {
    const st = this.st(); st.kc = (st.kc || 0) + 1;
    if (st.kc >= this.cfg().killsPerBun) { st.kc = 0; if (S.res.bun > 0) { const wasFull = S.res.bun >= this.cap(); S.res.bun--; if (wasFull) st.last = now(); return true; } }
    return false;
  },
  empty() { return S.res.bun <= 0; },
  buyLeft() { const st = this.st(); if (st.bday !== S.day) { st.bday = S.day; st.bought = 0; } return Math.max(0, this.cfg().buy.daily - st.bought); },
  buy() {
    const b = this.cfg().buy; if (this.buyLeft() <= 0) return 'limit';
    if (!Eco.pay({ silver: b.silver })) return 'res';
    this.st().bought++; S.res.bun = Math.min(this.cfg().hardCap, S.res.bun + b.bun); return b.bun;
  },
  // 不足時的統一提示（UI 層實作 modal）
  need() { if (typeof UI !== 'undefined' && UI.staminaModal) UI.staminaModal(); },
};

/* ============================================================
 * v3d：AchievementManager（成就）
 * ============================================================ */
const AchievementManager = {
  val(stat) {
    switch (stat) {
      case 'kills': return S.stats.kills || 0;
      case 'tower': return S.tower.floor;
      case 'trial': return S.trial.maxCleared || 0;
      case 'recruit': return S.stats.recruit || 0;
      case 'heroes': return CFG.heroes.filter(h => S.heroes[h.id].star > 0).length;
      case 'lv': return S.lv;
      case 'power': return PlayerManager.power();
      case 'sign': return S.sign.n || 0;
      case 'donate': return S.stats.donate || 0;
    }
    return 0;
  },
  got(a) { return !!(S.ach && S.ach[a.id]); },
  done(a) { return this.val(a.stat) >= a.need; },
  canClaim(a) { return !this.got(a) && this.done(a); },
  claim(id) { const a = CFG.achievements.find(x => x.id === id); if (!a || !this.canClaim(a)) return null; S.ach = S.ach || {}; S.ach[id] = 1; Eco.add(a.r); return a.r; },
  anyClaim() { return CFG.achievements.some(a => this.canClaim(a)); },
  count() { return CFG.achievements.filter(a => this.got(a)).length; },
};

/* ============================================================
 * v3d：ChapterManager（主線章節：試煉之塔／俠客居推進）
 * ============================================================ */
const ChapterManager = {
  of(floor) { let c = CFG.chapters[0], i = 0; CFG.chapters.forEach((x, k) => { if (floor >= x.from) { c = x; i = k; } }); return Object.assign({ idx: i }, c); },
  cur() { return this.of(S.tower.floor + 1); },
  progress() { const c = this.cur(), n = CFG.chapters[c.idx + 1]; const span = n ? n.from - c.from : 10; return { c, done: S.tower.floor + 1 - c.from, span }; },
};

/* ============================================================
 * v3d：GachaManager（英雄帖招募）
 *  - 機率依文件俠客品質（CFG.recruit.rates）
 *  - 保底：CFG.gacha.pity 抽內必出不朽以上；十連必含傳世以上
 *  - 未擁有俠客 → 直接召喚（NEW）；已擁有 → 轉為碎片，用於文件升星碎片表
 * ============================================================ */
const GachaManager = {
  pity() { return S.pity || 0; },
  pityLeft() { return Math.max(0, CFG.gacha.pity - this.pity()); },
  shortfall(n) { return Math.max(0, n - S.res.tie); },
  silverFor(n) { return this.shortfall(n) * CFG.gacha.silverPerTie; },
  pull(n, allowSilver) {
    const miss = this.shortfall(n);
    if (miss > 0) { if (!allowSilver || !Eco.pay({ silver: miss * CFG.gacha.silverPerTie })) return null; S.res.tie += miss; }
    S.res.tie -= n; const firstEver = (S.stats.recruit || 0) === 0; S.stats.recruit = (S.stats.recruit || 0) + n;
    const res = []; let gotHigh = false;
    for (let i = 0; i < n; i++) {
      S.pity = (S.pity || 0) + 1;
      let q = firstEver && i === 0 ? 1 : EquipManager.rollQuality(CFG.recruit.rates);
      if (S.pity >= CFG.gacha.pity) q = Math.max(q, 3);
      if (n >= 10 && i === n - 1 && !gotHigh) q = Math.max(q, CFG.recruit.tenPullGuarantee);
      if (q >= 2) gotHigh = true;
      if (q >= 3) S.pity = 0;
      const pool = CFG.heroes.filter(h => h.q === q && !h.limited); const h = pool[rint(0, pool.length - 1)];
      const hs = S.heroes[h.id]; let cnt, isNew = false;
      if (hs.star === 0 && CFG.gacha.newHeroWhole) {
        const need = CFG.starShards[0][q]; cnt = Math.max(1, need - hs.shards); hs.shards += cnt; isNew = true;
        HeroManager.starUp(h.id);
      } else { cnt = rint(...CFG.gacha.dupShards[q]); hs.shards += cnt; }
      res.push({ id: h.id, cnt, q, isNew });
    }
    return res;
  },
  /** v3.1 高級招募：消耗高級英雄帖（大月卡／終身卡取得），機率見 CFG.recruitHi，計入保底 */
  pullHi(n) {
    if ((S.res.tieHi || 0) < n) return null;
    S.res.tieHi -= n; S.stats.recruit = (S.stats.recruit || 0) + n;
    const res = [];
    for (let i = 0; i < n; i++) {
      S.pity = (S.pity || 0) + 1;
      let q = EquipManager.rollQuality(CFG.recruitHi.rates);
      if (S.pity >= CFG.gacha.pity) q = Math.max(q, 3);
      if (q >= 3) S.pity = 0;
      res.push(this.grant(q));
    }
    return res;
  },
  grant(q) {
    const pool = CFG.heroes.filter(h => h.q === q && !h.limited); const h = pool[rint(0, pool.length - 1)];
    const hs = S.heroes[h.id]; let cnt, isNew = false;
    if (hs.star === 0 && CFG.gacha.newHeroWhole) { const need = CFG.starShards[0][q]; cnt = Math.max(1, need - hs.shards); hs.shards += cnt; isNew = true; HeroManager.starUp(h.id); }
    else { cnt = rint(...CFG.gacha.dupShards[q]); hs.shards += cnt; }
    return { id: h.id, cnt, q, isNew };
  },
  // 俠客主動技倍率：星級＋突破讓技能在戰鬥中更有意義
  skillMult(id) { const h = S.heroes[id]; if (!h) return 1; return (1 + CFG.gacha.starSkillPct / 100 * Math.max(0, h.star - 1)) * (1 + 0.2 * h.bt); },
};
// 舊介面相容：HeroManager.recruit 走新的招募邏輯（不使用銀錠補足）
HeroManager.recruit = function (n) { return GachaManager.pull(n, false); };

  /* ---------------- 背景（視差層） ---------------- */
